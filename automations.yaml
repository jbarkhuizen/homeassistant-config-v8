- id: "1778852371479"
  alias: Security - Badlogin Daily 09h00 Check
  description:
    "Detects daily bad-login spikes vs yesterday's baseline; alerts when
    over threshold. Rolls the baseline after the check for a clean daily window. Channels:
    Email, Telegram, Mobile Push (SM-G996B), Persistent, System Log."
  triggers:
    - trigger: time
      at: 09:00:00
  actions:
    - variables:
        threshold: 25
        current: "{{ states('sensor.badlogin') | int(0) }}"
        baseline: "{{ states('input_number.badlogin_previous_count') | int(0) }}"
        diff: "{{ (current - baseline) | int(0) }}"
        detail:
          "Baseline: {{ baseline }} | Current: {{ current }} | Increase: {{ diff
          }} | Threshold: {{ threshold }}"
        risk_level:
          "{% if diff >= threshold * 3 %}CRITICAL{% elif diff >= threshold
          * 2 %}HIGH{% elif diff >= threshold %}ELEVATED{% else %}NORMAL{% endif %}"
        risk_color:
          "{% if diff >= threshold * 3 %}#B71C1C{% elif diff >= threshold
          * 2 %}#F44336{% elif diff >= threshold %}#FF9800{% else %}#4CAF50{% endif
          %}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ diff >= threshold }}"
          sequence:
            - action: persistent_notification.create
              data:
                title:
                  "🚨 Security: Bad Logins Spike - {{ risk_level }} (09:00
                  {{ now().strftime('%d %b %Y') }})"
                message:
                  "Bad login spike detected at {{ now().strftime('%Y-%m-%d %H:%M:%S')
                  }}. Risk Level: {{ risk_level }}. Baseline: {{ baseline }}. Current: {{
                  current }}. Increase: {{ diff }}. Threshold: {{ threshold }}. Check Settings
                  > Security > IP Ban log and review /config/home-assistant.log. System:
                  192.168.1.31:8123"
                notification_id: security_badlogins_spike
            - action: telegram_bot.send_message
              data:
                chat_id: 6167623299
                message:
                  "🚨 Security: Bad Logins Spike - {{ risk_level }}. Baseline:
                  {{ baseline }} | Current: {{ current }} | Increase: {{ diff }} | Threshold:
                  {{ threshold }}. Check HA Security logs immediately. {{ now().strftime('%Y-%m-%d
                  %H:%M:%S') }}"
            - action: notify.email_ha
              data:
                title:
                  "🚨 Security: Bad Logins Spike - {{ risk_level }} ({{ now().strftime('%Y-%m-%d')
                  }})"
                message:
                  "SECURITY ALERT. Date: {{ now().strftime('%A, %d %B %Y at %H:%M:%S')
                  }}. Risk Level: {{ risk_level }}. {{ detail }}. Review IP Ban log, home-assistant.log,
                  firewall, Nabu Casa access rules and device credentials. System: http://192.168.1.31:8123
                  Cloud: https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/"
            - action: notify.mobile_app_sm_g996b
              data:
                title: "🚨 Security Alert - Bad Logins Spike ({{ risk_level }})"
                message:
                  "{{ diff }} new bad logins detected. Baseline: {{ baseline }},
                  Current: {{ current }}, Risk: {{ risk_level }}."
                data:
                  channel: Security
                  importance: high
                  group: ha-security
                  color: "{{ risk_color }}"
                  actions:
                    - action: OPEN_HA
                      title: Open HA Security
                      uri: http://192.168.1.31:8123/config/auth
            - action: system_log.write
              data:
                message:
                  "Security BAD LOGIN SPIKE: {{ diff }} new logins. Baseline: {{
                  baseline }}, Current: {{ current }}, Threshold: {{ threshold }}, Risk:
                  {{ risk_level }}."
                level: warning
        - conditions:
            - condition: template
              value_template: "{{ diff < threshold }}"
          sequence:
            - action: persistent_notification.create
              data:
                title:
                  "✅ Security: Bad Logins OK (09:00 {{ now().strftime('%d %b %Y'
                  )}})"
                message:
                  "Daily bad login check completed at {{ now().strftime('%Y-%m-%d
                  %H:%M:%S') }}. No spike detected. Baseline: {{ baseline }}. Current:
                  {{ current }}. Increase: {{ diff }}. Threshold: {{ threshold }}. Risk
                  Level: NORMAL."
                notification_id: security_badlogins_ok
            - action: telegram_bot.send_message
              data:
                chat_id: 6167623299
                message:
                  "✅ Security: Bad Logins OK. Baseline: {{ baseline }} | Current:
                  {{ current }} | Increase: {{ diff }} | Threshold: {{ threshold }} | Status:
                  NORMAL. {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            - action: notify.email_ha
              data:
                title: "✅ Security: Bad Logins OK - {{ now().strftime('%Y-%m-%d') }}"
                message:
                  "SECURITY DAILY CHECK - NO SPIKE DETECTED. Date: {{ now().strftime('%A,
                  %d %B %Y at %H:%M:%S') }}. Baseline: {{ baseline }}. Current: {{ current
                  }}. Increase: {{ diff }}. Threshold: {{ threshold }}. Risk Level: NORMAL.
                  No action required. System: http://192.168.1.31:8123"
            - action: notify.mobile_app_sm_g996b
              data:
                title: ✅ Security Check OK (09:00)
                message:
                  "Bad logins: baseline {{ baseline }}, current {{ current }}, increase
                  {{ diff }}. Below threshold of {{ threshold }}. All clear."
                data:
                  channel: Security
                  importance: min
                  group: ha-security
                  color: "#4CAF50"
            - action: system_log.write
              data:
                message: Badlogins OK at 09:00 - {{ detail }}
                level: info
    - action: input_number.set_value
      target:
        entity_id: input_number.badlogin_previous_count
      data:
        value: "{{ current }}"
  mode: single