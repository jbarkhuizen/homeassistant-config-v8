- id: "1778851195233"
  alias: Security - Badlogin Daily 09h00 Check
  description:
    "Detects daily bad-login spikes vs yesterday's baseline; alerts when
    over threshold. Rolls the baseline after the check for a clean daily window. Channels:
    Email, Telegram, Mobile Push (SM-G996B), Persistent, System Log.

    "
  triggers:
    - at: 09:00:00
      trigger: time
  actions:
    - variables:
        threshold: 25
        current: "{{ states('sensor.badlogin') | int(0) }}"
        baseline: "{{ states('input_number.badlogin_previous_count') | int(0) }}"
        diff: "{{ (current - baseline) | int }}"
        detail:
          "Baseline: {{ baseline }} | Current: {{ current }} | Increase: {{ diff
          }} | Threshold: {{ threshold }}"
        risk_level:
          "{% if diff >= threshold * 3 %}CRITICAL {% elif diff >= threshold
          * 2 %}HIGH {% elif diff >= threshold %}ELEVATED {% else %}NORMAL {% endif
          %}"
        risk_color:
          "{% if diff >= threshold * 3 %}#B71C1C {% elif diff >= threshold
          * 2 %}#F44336 {% elif diff >= threshold %}#FF9800 {% else %}#4CAF50 {% endif
          %}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ diff >= threshold }}"
          sequence:
            - data:
                title:
                  "\U0001F6A8 Security: Bad Logins Spike — {{ risk_level }} (09:00
                  {{ now().strftime('%d %b %Y') }})"
                message:
                  "Bad login spike detected at {{ now().strftime('%Y-%m-%d %H:%M:%S')
                  }}.\n\U0001F510 Security Alert Details: • Risk Level: {{ risk_level }}
                  • Baseline (yesterday): {{ baseline }} • Current Count: {{ current }}
                  • Increase: {{ diff }} (threshold: {{ threshold }})\n⚠️ Recommended Actions:
                  • Check Settings → Security → IP Ban log • Review /config/home-assistant.log
                  for failed login sources • Consider enabling brute-force protection in
                  HA settings • If source is external, review firewall and Nabu Casa access
                  rules • Check if any device has incorrect credentials configured\n\U0001F310
                  192.168.1.31:8123"
                notification_id: security_badlogins_spike
              action: persistent_notification.create
            - data:
                chat_id: "6167623299"
                message:
                  "\U0001F6A8 *Security: Bad Logins Spike — {{ risk_level }}*\n\U0001F510
                  Baseline: {{ baseline }} | Current: {{ current }} \U0001F4C8 Increase:
                  {{ diff }} (threshold: {{ threshold }}) ⚠️ Risk Level: *{{ risk_level
                  }}*\nCheck HA Security logs immediately. _{{ now().strftime('%Y-%m-%d
                  %H:%M:%S') }}_ \U0001F310 192.168.1.31:8123"
                parse_mode: markdown
              action: telegram_bot.send_message
            - data:
                title:
                  "\U0001F6A8 Security: Bad Logins Spike — {{ risk_level }} ({{ now().strftime('%Y-%m-%d')
                  }})"
                message: "SECURITY ALERT — BAD LOGINS SPIKE DETECTED

                  Date: {{ now().strftime('%A, %d %B %Y at %H:%M:%S') }}

                  ================================================================================

                  ALERT DETAILS

                  Risk Level: {{ risk_level }} {{ detail }}

                  RECOMMENDED ACTIONS: 1. Check Settings → Security → IP Ban log in Home
                  Assistant 2. Review /config/home-assistant.log for failed login sources
                  and IP addresses 3. Enable brute-force protection if not already active
                  4. If source is external, review firewall and Nabu Casa access rules 5.
                  Check all connected devices for incorrect credentials 6. Consider enabling
                  2-factor authentication on your HA account

                  ================================================================================

                  System: http://192.168.1.31:8123 Cloud: https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/"
              action: notify.email_ha
            - data:
                title: "\U0001F6A8 Security Alert — Bad Logins Spike ({{ risk_level }})"
                message:
                  "{{ diff }} new bad logins detected (baseline: {{ baseline }},
                  current: {{ current }}). Risk: {{ risk_level }}. Check HA Security logs
                  immediately."
                data:
                  channel: Security
                  importance: high
                  group: ha-security
                  color: "{{ risk_color }}"
                  actions:
                    - action: OPEN_HA
                      title: Open HA Security
                      uri: http://192.168.1.31:8123/config/auth
              action: notify.mobile_app_sm_g996b
            - data:
                message:
                  "Security BAD LOGIN SPIKE: {{ diff }} new logins (baseline: {{
                  baseline }}, current: {{ current }}, threshold: {{ threshold }}, risk:
                  {{ risk_level }}). Channels: Email, Telegram, Mobile Push (SM-G996B),
                  Persistent."
                level: warning
              action: system_log.write
        - conditions:
            - condition: template
              value_template: "{{ diff < threshold }}"
          sequence:
            - data:
                title:
                  "✅ Security: Bad Logins OK (09:00 {{ now().strftime('%d %b %Y')
                  }})"
                message:
                  "Daily bad login check completed at {{ now().strftime('%Y-%m-%d
                  %H:%M:%S') }}.\n✅ No spike detected — security status is normal.\n\U0001F510
                  Check Details: • Baseline (yesterday): {{ baseline }} • Current Count:
                  {{ current }} • Increase: {{ diff }} (threshold: {{ threshold }}) • Risk
                  Level: NORMAL"
                notification_id: security_badlogins_ok
              action: persistent_notification.create
            - data:
                chat_id: "6167623299"
                message: "✅ *Security: Bad Logins OK (09:00)*

                  No spike detected today. Baseline: {{ baseline }} | Current: {{ current
                  }} | Increase: {{ diff }} Threshold: {{ threshold }} | Status: NORMAL

                  _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_"
                parse_mode: markdown
              action: telegram_bot.send_message
            - data:
                title: "✅ Security: Bad Logins OK — {{ now().strftime('%Y-%m-%d') }}"
                message: "SECURITY DAILY CHECK — NO SPIKE DETECTED

                  Date: {{ now().strftime('%A, %d %B %Y at %H:%M:%S') }}

                  ================================================================================

                  DAILY BAD LOGIN CHECK: NORMAL

                  Baseline (yesterday): {{ baseline }} Current Count: {{ current }} Increase:
                  {{ diff }} Threshold: {{ threshold }} Risk Level: NORMAL

                  No action required. System security is operating normally.

                  ================================================================================

                  System: http://192.168.1.31:8123"
              action: notify.email_ha
            - data:
                title: ✅ Security Check OK (09:00)
                message:
                  "Bad logins: baseline {{ baseline }}, current {{ current }}, increase
                  {{ diff }}. Below threshold of {{ threshold }}. All clear."
                data:
                  channel: Security
                  importance: min
                  group: ha-security
                  color: "#4CAF50"
              action: notify.mobile_app_sm_g996b
            - data:
                message: Badlogins OK at 09:00 — {{ detail }}
                level: info
              action: system_log.write
    - target:
        entity_id: input_number.badlogin_previous_count
      data:
        value: "{{ current }}"
      action: input_number.set_value
  mode: single
