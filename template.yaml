    # -----------------------------------------------------------------------
    # Solar Daily Report 18:00
    # -----------------------------------------------------------------------
    - name: "Solar Daily Report 18h00 Message"
      unique_id: solar_daily_report_18h00_message
      icon: mdi:solar-power
      availability: >
        {{ states('sensor.daily_total_solar_production') not in ['unknown', 'unavailable', 'None', '', none]
           and states('sensor.solar_forecast_total_today') not in ['unknown', 'unavailable', 'None', '', none]
           and states('sensor.energy_production_today_remaining') not in ['unknown', 'unavailable', 'None', '', none]
           and states('sensor.solar_forecast_accuracy_so_far') not in ['unknown', 'unavailable', 'None', '', none] }}
      state: >
        {% set actual_raw = states('sensor.daily_total_solar_production') %}
        {% set forecast_raw = states('sensor.solar_forecast_total_today') %}
        {% set remaining_raw = states('sensor.energy_production_today_remaining') %}
        {% set accuracy_raw = states('sensor.solar_forecast_accuracy_so_far') %}
        {% set peak_raw = states('sensor.solar_forecast_peak_time_today') %}

        {% set actual_production = actual_raw | float(0) %}
        {% set forecast_value = forecast_raw | float(0) %}
        {% set remaining = remaining_raw | float(0) %}
        {% set accuracy = accuracy_raw | float(0) %}
        {% set variance = actual_production - forecast_value %}

        {% if peak_raw in ['unknown', 'unavailable', 'None', '', none] %}
          {% set peak_display = 'N/A' %}
        {% else %}
          {% set peak_dt = as_datetime(peak_raw) %}
          {% if peak_dt %}
            {% set peak_display = peak_dt.strftime('%H:%M') %}
          {% else %}
            {% set peak_display = 'N/A' %}
          {% endif %}
        {% endif %}

        Daily Solar Report - {{ now().strftime('%d %B %Y') }}

        ACTUAL PRODUCTION
        Generated: {{ "%.2f" | format(actual_production) }} kWh

        TODAY'S FORECAST
        Expected: {{ "%.2f" | format(forecast_value) }} kWh
        Remaining: {{ "%.2f" | format(remaining) }} kWh

        VARIANCE
        {% if forecast_value > 0 %}
          {% set variance_percent = ((variance / forecast_value) * 100) | round(1) %}
          {% if variance >= 0 %}
        Performance: +{{ "%.2f" | format(variance) }} kWh ({{ variance_percent }}% above forecast)
          {% else %}
        Performance: {{ "%.2f" | format(variance) }} kWh ({{ variance_percent | abs }}% below forecast)
          {% endif %}
        {% else %}
        Performance: {{ "%.2f" | format(variance) }} kWh (forecast unavailable)
        {% endif %}

        FORECAST ACCURACY
        So Far: {{ accuracy | round(1) }}%

        PEAK GENERATION
        Peak Time: {{ peak_display }} SAST

        Next Update: 18:00 daily
        Inverters: Deye Master + Slave

# ---------------------------------------------------------------------------
# TEMPLATE ENTITIES - Binary Sensors & Trigger-based Sensors
# ---------------------------------------------------------------------------
- binary_sensor:
    - name: "Network Monitoring Active"
      unique_id: network_monitoring_active
      device_class: connectivity
      state: "{{ (as_timestamp(now()) - as_timestamp(states.sensor.network_devices_table.last_changed)) < 600 }}"

# Trigger-based template sensor: Auto Update Status
- trigger:
    - platform: event
      event_type: auto_update_cycle_complete
  sensor:
    - name: "Auto Update Status"
      unique_id: auto_update_status
      icon: >
        {% set status = trigger.event.data.status %}
        {% if status == 'success' %}mdi:update
        {% elif status == 'partial' %}mdi:update-alert
        {% elif status == 'failure' %}mdi:alert-circle-outline
        {% elif status == 'no_updates' %}mdi:update-off
        {% else %}mdi:progress-clock{% endif %}
      state: "{{ trigger.event.data.status }}"
      attributes:
        last_run: "{{ trigger.event.data.last_run }}"
        pre_count: "{{ trigger.event.data.pre_count }}"
        post_count: "{{ trigger.event.data.post_count }}"
        attempted_entities: "{{ trigger.event.data.attempted_entities }}"
        remaining_entities: "{{ trigger.event.data.remaining_entities }}"
        duration_seconds: "{{ trigger.event.data.duration_seconds }}"
        restart_required: "{{ trigger.event.data.restart_required }}"
        status_detail: "{{ trigger.event.data.status_detail }}"

