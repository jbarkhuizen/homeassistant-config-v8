# ==============================================================================
# Template Integration Entities (Modern)
# File: template.yaml
# Purpose:
# - Provides template sensors and template binary sensors
# - Supports trigger-based template sensors
#
# IMPORTANT:
# This file is included from configuration.yaml via:
#   template: !include template.yaml
#
# Therefore it must be a valid Template Integration structure:
#   - sensor: ...
#   - binary_sensor: ...
#   - trigger: ...
# ==============================================================================

# ---------------------------------------------------------------------------
# SmartHome Integrations (Deye / Sunsynk helpers)
# Source: https://github.com/tomatensaus/DeyeSolarDesktop/blob/main/template.yaml
# ---------------------------------------------------------------------------
- sensor:
    - name: "deyeinvertermaster_solar_power_used"
      state: "{{ (states('sensor.deyeinvertermaster_summary_day_pv') | float(0) - states('sensor.deyeinvertermaster_summary_day_battery_charge') | float(0)) | round(1) }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "deyeinvertermaster_essential_load"
      state: "{{ (states('sensor.deyeinvertermaster_inverter_output_power') | float(0) + (states('sensor.deyeinvertermaster_grid_load') | float(0) - states('sensor.deyeinvertermaster_aux_output_power') | float(0))) | round(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    - name: "deyeinvertermaster_non_essential_load"
      state: "{{ (states('sensor.deyeinvertermaster_grid_power_ct_clamp') | float(0) - (states('sensor.deyeinvertermaster_grid_load_l1') | float(0))) | round(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    - name: "deyeinvertermaster_priority_charge_or_load"
      state: >
        {% if is_state('select.deyeinvertermaster_energy_management_model', 'Battery Priority Mode') %}
          off
        {% else %}
          on
        {% endif %}

    - name: "Prepaid Eskom Units Used Since Recharge"
      unique_id: prepaid_eskom_units_used_since_recharge
      unit_of_measurement: "kWh"
      state_class: measurement
      device_class: energy
      state: >
        {% set current_total_kwh = (states('sensor.deyeinvertercombined_summary_total_grid_import_buy') | float(0)) * 1000 %}
        {% set baseline_kwh = states('input_number.prepaid_meter_grid_import_baseline') | float(0) %}
        {% set raw_used = current_total_kwh - baseline_kwh %}
        {% set calibration = states('input_number.prepaid_meter_calibration_factor') | float(1) %}
        {{ ([raw_used, 0] | max * calibration) | round(2) }}
      availability: >
        {{ states('sensor.deyeinvertercombined_summary_total_grid_import_buy') not in ['unknown', 'unavailable', 'none']
           and states('input_number.prepaid_meter_grid_import_baseline') not in ['unknown', 'unavailable', 'none']
           and states('input_number.prepaid_meter_calibration_factor') not in ['unknown', 'unavailable', 'none'] }}
      icon: mdi:transmission-tower-import

    - name: "Prepaid Units Left"
      unique_id: prepaid_units_left
      unit_of_measurement: "kWh"
      state_class: measurement
      state: >
        {% set purchased = states('input_number.prepaid_meter_units') | float(0) %}
        {% set used = states('sensor.prepaid_eskom_units_used_since_recharge') | float(0) %}
        {{ [purchased - used, 0] | max | round(2) }}
      availability: >
        {{ states('input_number.prepaid_meter_units') not in ['unknown', 'unavailable', 'none']
           and states('sensor.prepaid_eskom_units_used_since_recharge') not in ['unknown', 'unavailable', 'none'] }}
      icon: >
        {% set units = states('sensor.prepaid_units_left') | float(0) %}
        {% if units <= 5 %}
          mdi:alert
        {% elif units <= 20 %}
          mdi:battery-alert
        {% elif units <= 50 %}
          mdi:battery-low
        {% else %}
          mdi:battery-high
        {% endif %}

    - name: "Grid Units Used This Hour"
      unique_id: grid_units_used_this_hour
      unit_of_measurement: "kWh"
      state_class: measurement
      device_class: energy
      state: >
        {{ ((states('sensor.grid_units_used_hourly') | float(0)) * 1000) | round(3) }}
      availability: >
        {{ states('sensor.grid_units_used_hourly') not in ['unknown', 'unavailable', 'none'] }}
      icon: mdi:transmission-tower-import

    - name: "Solar Generated This Hour"
      unique_id: solar_generated_this_hour
      unit_of_measurement: "kWh"
      state_class: measurement
      device_class: energy
      state: >
        {{ ((states('sensor.solar_generated_hourly') | float(0)) * 1000) | round(3) }}
      availability: >
        {{ states('sensor.solar_generated_hourly') not in ['unknown', 'unavailable', 'none'] }}
      icon: mdi:solar-power

    - name: "Battery Discharged This Hour"
      unique_id: battery_discharged_this_hour
      unit_of_measurement: "kWh"
      state_class: measurement
      device_class: energy
      state: >
        {{ ((states('sensor.battery_discharged_hourly') | float(0)) * 1000) | round(3) }}
      availability: >
        {{ states('sensor.battery_discharged_hourly') not in ['unknown', 'unavailable', 'none'] }}
      icon: mdi:battery-arrow-down

    - name: "Prepaid Units Variance"
      unique_id: prepaid_units_variance
      unit_of_measurement: "kWh"
      state_class: measurement
      state: >
        {% set estimated = states('sensor.prepaid_units_left') | float(0) %}
        {% set actual = states('input_number.prepaid_meter_actual_balance') | float(0) %}
        {{ (estimated - actual) | round(2) }}
      availability: >
        {{ states('sensor.prepaid_units_left') not in ['unknown', 'unavailable', 'none']
           and states('input_number.prepaid_meter_actual_balance') not in ['unknown', 'unavailable', 'none'] }}
      icon: >
        {% set variance = states('sensor.prepaid_units_variance') | float(0) | abs %}
        {% if variance <= 1 %}
          mdi:check-circle
        {% elif variance <= 5 %}
          mdi:alert-outline
        {% else %}
          mdi:alert
        {% endif %}

    - name: "Prepaid Balance Accuracy Status"
      unique_id: prepaid_balance_accuracy_status
      state: >
        {% set variance = states('sensor.prepaid_units_variance') | float(0) | abs %}
        {% if variance <= 1 %}
          Good
        {% elif variance <= 5 %}
          Monitor
        {% else %}
          Investigate
        {% endif %}
      icon: >
        {% set variance = states('sensor.prepaid_units_variance') | float(0) | abs %}
        {% if variance <= 1 %}
          mdi:check-decagram
        {% elif variance <= 5 %}
          mdi:clipboard-alert-outline
        {% else %}
          mdi:alert-decagram
        {% endif %}

    - name: "Prepaid Recommended Calibration Factor"
      unique_id: prepaid_recommended_calibration_factor
      unit_of_measurement: "x"
      state: >
        {% set purchased = states('input_number.prepaid_meter_units') | float(0) %}
        {% set actual = states('input_number.prepaid_meter_actual_balance') | float(0) %}
        {% set consumed_actual = purchased - actual %}
        {% set current_total_kwh = (states('sensor.deyeinvertercombined_summary_total_grid_import_buy') | float(0)) * 1000 %}
        {% set baseline_kwh = states('input_number.prepaid_meter_grid_import_baseline') | float(0) %}
        {% set consumed_raw = current_total_kwh - baseline_kwh %}
        {% if consumed_raw > 0 and consumed_actual >= 0 %}
          {{ (consumed_actual / consumed_raw) | round(3) }}
        {% else %}
          {{ states('input_number.prepaid_meter_calibration_factor') | float(1) | round(3) }}
        {% endif %}
      availability: >
        {{ states('input_number.prepaid_meter_units') not in ['unknown', 'unavailable', 'none']
           and states('input_number.prepaid_meter_actual_balance') not in ['unknown', 'unavailable', 'none']
           and states('sensor.deyeinvertercombined_summary_total_grid_import_buy') not in ['unknown', 'unavailable', 'none']
           and states('input_number.prepaid_meter_grid_import_baseline') not in ['unknown', 'unavailable', 'none'] }}
      icon: mdi:tune-variant

    - name: "Prepaid Daily Accuracy Snapshot Display"
      unique_id: prepaid_daily_accuracy_snapshot_display
      state: >
        {{ states('input_text.prepaid_daily_accuracy_snapshot') }}
      icon: mdi:clipboard-text-outline

    - name: "Sonoff 10023b8a5d Weekly Energy (Sunday Start)"
      unit_of_measurement: "kWh"
      state_class: total
      state: >
          {% if now().weekday() == 6 %}
            {{ states('sensor.sonoff_10023b8a5d_energy') | float(0) }}
          {% else %}
            {{ states('sensor.sonoff_10023b8a5d_daily') | float(0) + 
               (now().strftime('%U') | int - 1) * states('sensor.sonoff_10023b8a5d_daily') | float(0) }}
          {% endif %}
    # -----------------------------------------------------------------------
    # Inverter Automations
    # -----------------------------------------------------------------------
    - name: "Automation InverterConfig Update Times Last Run"
      unique_id: automation_inverterconfig_update_times_last_run
      state: >
        {% set t = state_attr('automation.inverterconfig_update_times', 'last_triggered') %}
