update_and_restart:
  alias: Update And Restart
  sequence:
  - condition: template
    value_template: '{{ states.update | selectattr(''state'', ''eq'', ''on'') | list
      | count > 0 }}'
  - target:
      entity_id: '{{ states.update | selectattr(''state'', ''eq'', ''on'') | map(attribute=''entity_id'')
        | list }}'
    data:
      backup: true
    action: update.install
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.update_restart_pending
  - delay: 00:02:00
  - action: homeassistant.restart
  description: ''
