automation:
  - id: energy_monthly_history_snapshot
    alias: Energy Monthly History Snapshot
    description: Stores the latest monthly energy usage values into 6 month rolling history helpers on the 1st day of each month at 06:45
    trigger:
      - platform: time
        at: "06:45:00"
    condition:
      - condition: template
        value_template: "{{ now().day == 1 }}"
    action:
      - action: script.energy_monthly_history_snapshot
    mode: single