# ===============================================================================
# InfluxDB Configuration with System Monitoring
# File: packages/influxdb.yaml
# Updated: 2026-05-26
#
# IMPORTANT:
# - InfluxDB connection and authentication settings are configured in the UI
# - This YAML file contains filtering, retry and measurement options only
# ===============================================================================

influxdb:
  max_retries: 3
  default_measurement: state

  exclude:
    entity_globs:
      - sensor.*_uptime
      - sensor.*_last_boot
      - sensor.date*
      - sensor.time*
    entities:
      - sun.sun
      - sensor.last_boot
      - sensor.uptime

  include:
    domains:
      - sensor
      - binary_sensor

    entity_globs:
      # Sunsynk / Deye inverter entities
      - "sensor.deyeinvertermaster_*"
      - "sensor.deyeinverterslave_*"
      - "sensor.deyeinvertercombined_*"

      # Prepaid meter
      - "sensor.prepaid_*"
      - "input_number.prepaid_*"

      # Energy monitoring
      - "sensor.*energy*"
      - "sensor.*power*"
      - "sensor.*battery*"
      - "sensor.*grid*"
      - "sensor.*solar*"

      # Speed test entities
      - "sensor.cloudflare_speed_test_*"
      - "sensor.speedtest_*"
      - "binary_sensor.speedtest_*"

      # System monitoring
      - "sensor.processor_*"
      - "sensor.memory_*"
      - "sensor.disk_*"
      - "sensor.swap_*"
      - "sensor.system_*"
      - "sensor.load_*"
      - "sensor.throughput_*"
      - "sensor.packets_*"
      - "sensor.ipv4_*"
      - "sensor.last_boot"
      - "binary_sensor.system_*"
      - "sensor.cpu_usage_*"
      - "sensor.memory_usage_*"

      # Battery management
      - "sensor.battery_*"
      - "binary_sensor.battery_*"
      - "counter.battery_*"
      - "input_number.battery_*"

      # Combined sensors
      - "sensor.combined_*"
      - "sensor.total_grid_*"
      - "sensor.energy_independence_*"
      - "sensor.daily_*"
      - "sensor.monthly_*"

      # Helper entities monitoring
      - "sensor.missing_*"
      - "sensor.helper_entities_*"
      - "binary_sensor.all_critical_*"

    entities:
      # Specific battery sensors
      - sensor.temperature_humidity_sensor_battery
      - sensor.temperature_humidity_sensor_battery_2
      - sensor.motion_sensor_battery
      - sensor.snzb_05p_battery

      # Integration sensors
      - sensor.deyeinvertermaster_summary_total_battery_charge_grid
      - sensor.deyeinverterslave_summary_total_battery_charge_grid
      - sensor.deyeinvertermaster_summary_total_pv_generation
      - sensor.deyeinverterslave_summary_total_pv_generation
      - sensor.deyeinvertermaster_summary_total_grid_export
      - sensor.deyeinverterslave_summary_total_grid_export

      # Combined template sensors
      - sensor.combined_solar_power
      - sensor.combined_battery_soc
      - sensor.total_grid_import
      - sensor.total_grid_export
      - sensor.daily_solar_generation_combined
      - sensor.energy_independence_percentage

      # Battery efficiency sensors
      - sensor.battery_efficiency_master
      - sensor.battery_efficiency_slave

      # Utility meter entities
      - sensor.deyeinvertermaster_summary_day_battery_charge_grid
      - sensor.deyeinverterslave_summary_day_battery_charge_grid
      - sensor.deyeinvertermaster_summary_day_pv_generation
      - sensor.deyeinverterslave_summary_day_pv_generation
      - sensor.deyeinvertermaster_summary_day_grid_export
      - sensor.deyeinverterslave_summary_day_grid_export

      # Exact first-test Grafana sensors
      - sensor.deyeinvertermaster_priority_charge_or_load
      - sensor.deyeinvertermaster_solar_power_used
      - sensor.deyeinvertermaster_essential_load
      - sensor.deyeinvertermaster_non_essential_load

      # Exact prepaid and hourly Grafana sensors
      - sensor.prepaid_eskom_units_used_since_recharge
      - sensor.prepaid_units_left
      - sensor.prepaid_units_variance
      - sensor.prepaid_balance_accuracy_status
      - sensor.prepaid_recommended_calibration_factor
      - sensor.grid_units_used_this_hour
      - sensor.solar_generated_this_hour
      - sensor.battery_discharged_this_hour
      - sensor.grid_units_used_hourly
      - sensor.solar_generated_hourly
      - sensor.battery_discharged_hourly

      # Prepaid helpers
      - input_number.prepaid_meter_units
      - input_number.prepaid_meter_actual_balance
      - input_number.prepaid_meter_grid_import_baseline
      - input_number.prepaid_meter_calibration_factor