# ===============================================================================
# InfluxDB Configuration - Comprehensive System Monitoring
# File: packages/influxdb.yaml
# Version: V2 (Complete Coverage)
# Updated: 2026-05-30
#
# IMPORTANT:
# - InfluxDB connection and authentication settings are configured in the UI
# - This YAML file contains filtering, retry and measurement options only
# - This version includes ALL valuable sensors from the system
# ===============================================================================

influxdb:
  max_retries: 3
  default_measurement: state

  exclude:
    entity_globs:
      # Exclude version and update sensors (status only, not time-series data)
      - sensor.*_version
      - sensor.*_newest_version
      - sensor.*version
      - update.*

      # Exclude status message sensors (state-only, no numeric data)
      - sensor.*_status
      - sensor.*_state
      - sensor.*_condition
      - sensor.*_message
      - sensor.*_error_message
      - sensor.*_last_error_message

      # Exclude text/string sensors
      - sensor.*_next_alarm
      - sensor.*_next_reminder
      - sensor.*_next_timer
      - sensor.*_current_stage
      - sensor.*_gcode_filename
      - sensor.*_task_name
      - sensor.*_printer_name
      - sensor.*_print_status
      - sensor.*_sd_card_status
      - sensor.*_print_bed_type
      - sensor.*_nozzle_type
      - sensor.*_speed_profile
      - sensor.*_active_tray
      - sensor.*_tray_*
      - sensor.*_airduct_mode
      - sensor.*_mqtt_connection_mode
      - sensor.*_print_type
      - sensor.*_ip_address
      - sensor.*_mac
      - sensor.*_wifi_*
      - sensor.*_latest_*
      - sensor.*_channel
      - sensor.*_channel_name
      - sensor.*arm_failure_cause
      - sensor.*_lastnoticename
      - sensor.*_lastnoticetime
      - sensor.*_imei
      - sensor.*_latitude
      - sensor.*_longitude
      - sensor.*_weather
      - sensor.*_condition
      - sensor.*_precipitation_kind
      - sensor.*_nearest_*
      - sensor.*_geocoded_location
      - sensor.*_accent_color
      - sensor.*_app_importance
      - sensor.*_app_standby_bucket
      - sensor.*_audio_mode
      - sensor.*_current_version
      - sensor.*_security_patch
      - sensor.*_charger_type
      - sensor.*_current_time_zone
      - sensor.*_do_not_disturb
      - sensor.*_ringer_mode
      - sensor.*_screen_orientation
      - sensor.*_link_health_state
      - sensor.*_location_name
      - sensor.*_moon_constellation
      - sensor.*_sun_constellation
      - sensor.*_uptonight
      - sensor.*_transparency_plain
      - sensor.*_lifted_index_plain
      - sensor.*_deepsky_forecast_*_plain
      - sensor.*_deepsky_forecast_*_description
      - sensor.*_home_arm_failure_cause
      - binary_sensor.speedtest_*

      # Exclude countdown timers (cosmetic only)
      - sensor.anniversary_*

      # Exclude uptime sensors (cumulative, not needed in DB)
      - sensor.*_uptime
      - sensor.*_last_boot
      - sensor.last_boot
      - sensor.uptime

      # Exclude date/time sensors
      - sensor.date*
      - sensor.time*

      # Exclude cosmetic entity count sensors
      - sensor.missing_*
      - sensor.helper_entities_*
      - sensor.*_count
      - binary_sensor.all_critical_*

    entities:
      # Exclude specific non-numeric or unnecessary entities
      - sun.sun
      - sensor.ha_time
      - sensor.deyeinvertermaster_ha_time
      - sensor.home_ids_push_notifications
      - sensor.jbarkhuizen_homeassistant_config_v7_latest_pull_request
      - sensor.jbarkhuizen_homeassistant_config_v8_latest_pull_request
      - sensor.jbarkhuizen_homeassistant_config_v7_latest_commit
      - sensor.jbarkhuizen_homeassistant_config_v8_latest_commit
      - sensor.home_assistant_updates_summary
      - conversation.home_assistant

  include:
    domains:
      - sensor
      - binary_sensor

    entity_globs:
      # ===== POWER & ENERGY MONITORING =====
      # Deye/Sunsynk inverters (complete coverage)
      - "sensor.deyeinvertermaster_*"
      - "sensor.deyeinverterslave_*"
      - "sensor.deyeinvertercombined_*"

      # All power and energy sensors
      - "sensor.*_power"
      - "sensor.*_energy"
      - "sensor.*_current"
      - "sensor.*_voltage"
      - "sensor.*_frequency"
      - "sensor.*_daily"
      - "sensor.*_hourly"
      - "sensor.*_monthly"
      - "sensor.*_weekly"
      - "sensor.*_yearly"
      - "sensor.*_total_energy"
      - "sensor.*_summary"
      - "sensor.*_cost"

      # Grid and import/export
      - "sensor.*_grid_*"
      - "sensor.*_import*"
      - "sensor.*_export*"
      - "sensor.main_eskom*"
      - "sensor.prepaid_*"
      - "input_number.prepaid_*"

      # ===== BATTERY & CHARGING =====
      - "sensor.*_battery*"
      - "sensor.*_soc"
      - "sensor.*_charge*"
      - "sensor.*_discharge*"
      - "binary_sensor.*_battery*"
      - "binary_sensor.*_charging*"

      # ===== TEMPERATURE MONITORING =====
      - "sensor.*_temperature*"
      - "sensor.*_temp*"
      - "sensor.*_thermal*"
      - "sensor.*_cpu_temperature"
      - "sensor.*_system_temperature"
      - "sensor.*_transformer"
      - "sensor.*_dewpoint"
      - "sensor.*_dew_point*"

      # ===== HUMIDITY & MOISTURE =====
      - "sensor.*_humidity*"
      - "sensor.*_moisture*"
      - "sensor.*_drying_*"

      # ===== WEATHER DATA =====
      - "sensor.openweathermap_*"
      - "sensor.astroweather_*"
      - "sensor.weather_*"

      # ===== SYSTEM MONITORING =====
      - "sensor.home_assistant_*"
      - "sensor.home_assistant_core_*"
      - "sensor.home_assistant_supervisor_*"
      - "sensor.*_cpu_*"
      - "sensor.*_memory_*"
      - "sensor.*_disk_*"
      - "sensor.*_cpu_speed"
      - "sensor.*_load_*"
      - "sensor.*_throughput_*"
      - "sensor.*_packets_*"
      - "sensor.*_ipv4_*"
      - "sensor.*_swap_*"
      - "sensor.homeassistant_db_size_mb"
      - "sensor.*_free_space_*"
      - "sensor.*_used_space_*"
      - "sensor.*_volume_*"

      # ===== NETWORK MONITORING =====
      - "sensor.*_data_received"
      - "sensor.*_data_sent"
      - "sensor.*_download_speed"
      - "sensor.*_upload_speed"
      - "sensor.*_packet_download_speed"
      - "sensor.*_packet_upload_speed"
      - "sensor.*_wan_status"
      - "sensor.*_external_ip"
      - "sensor.*_packets_received"
      - "sensor.*_packets_sent"
      - "sensor.network_*"
      - "sensor.speedtest_*"
      - "sensor.internet_*"

      # ===== 3D PRINTER MONITORING =====
      - "sensor.p2s_*"
      - "sensor.*_ams_*"
      - "sensor.*_print_*"
      - "sensor.*_nozzle_*"
      - "sensor.*_bed_*"
      - "sensor.*_chamber_*"
      - "sensor.*_fan_speed"
      - "sensor.*_layer"
      - "sensor.*_model_download"
      - "sensor.*_filament"

      # ===== NAS/SERVER MONITORING =====
      - "sensor.johanba_server_*"
      - "sensor.johanba_server_eth*"

      # ===== SOLAR PRODUCTION =====
      - "sensor.*_solar_*"
      - "sensor.*_pv_*"
      - "sensor.daily_total_solar*"
      - "sensor.lifetime_total_solar*"
      - "sensor.energy_production_*"
      - "sensor.power_production_*"

      # ===== CLIMATE CONTROL =====
      - "sensor.geyser_*"
      - "sensor.*_indoor_*"
      - "sensor.*_external_*"
      - "sensor.*_boorgat_*"

      # ===== SECURITY & ALARMS =====
      - "sensor.home_*_armed_status"
      - "sensor.badlogin"
      - "sensor.home_ids_*"

      # ===== DATABASE & PERFORMANCE =====
      - "sensor.db_*"
      - "sensor.*_db_*"
      - "sensor.influxdb_*"

      # ===== WATER/POOL SYSTEMS =====
      - "sensor.pool_*"
      - "sensor.*_pool_*"

      # ===== AUTOMATION SENSORS =====
      - "sensor.automation_*"

      # ===== OTHER NUMERIC SENSORS =====
      - "sensor.*_percent"
      - "sensor.*_count"
      - "sensor.*_uptime"
      - "sensor.cpu_speed"
      - "sensor.pv_string_balance"
      - "sensor.min_soc_battery"
      - "sensor.battery_system_health_score"
      - "sensor.battery_*_change_*"
      - "sensor.log_errors_on_hours_*"
      - "sensor.battery_discharged_*"
      - "sensor.battery_next_replacement_needed"
      - "sensor.glances_*"
      - "sensor.node_red_*"
      - "sensor.grafana_*"
      - "sensor.adguard_home_*"
      - "sensor.hp_color_laserjet_*"
      - "sensor.cloudflare_speed_test_*"
      - "sensor.geocaching_*"
      - "sensor.sm_a546e_*"
      - "sensor.samsung_*"
      - "sensor.local_ip"
      - "sensor.influxdb_flow_status"

    entities:
      # Specific important sensors
      - sensor.deyeinvertermaster_priority_charge_or_load
      - sensor.deyeinverterslave_priority_charge_or_load
      - sensor.deyeinvertermaster_solar_power_used
      - sensor.deyeinverterslave_solar_power_used
      - sensor.deyeinvertermaster_essential_load
      - sensor.deyeinvertermaster_non_essential_load
      - sensor.deyeinverterslave_essential_load
      - sensor.deyeinverterslave_non_essential_load
      - sensor.deyeinvertercombined_essential_load
      - sensor.deyeinvertercombined_non_essential_load

      # Battery SOC tracking
      - sensor.deyeinvertermaster_battery_soc
      - sensor.deyeinverterslave_battery_soc
      - sensor.deyeinvertercombined_battery_soc

      # Prepaid meter specifics
      - sensor.prepaid_eskom_units_used
      - sensor.prepaid_eskom_units_used_since_recharge
      - sensor.prepaid_units_left
      - sensor.prepaid_units_variance
      - sensor.prepaid_balance_accuracy_status
      - sensor.prepaid_recommended_calibration_factor
      - sensor.grid_units_used_this_hour
      - sensor.grid_units_used_hourly
      - sensor.solar_generated_this_hour
      - sensor.solar_generated_hourly

      # Temperature & humidity battery status
      - sensor.temperature_humidity_sensor_battery
      - sensor.temperature_humidity_sensor_battery_2
      - sensor.motion_sensor_battery
      - sensor.kitchen_temperature_humidity_temperature
      - sensor.kitchen_temperature_humidity_humidity
      - sensor.kitchen_temperature_humidity_battery

      # Mobile device battery
      - sensor.sm_a546e_battery_level
      - sensor.sm_a546e_battery_state
      - sensor.sm_a546e_battery_temperature
      - sensor.sm_a546e_battery_health
      - sensor.sm_a546e_light_sensor
      - sensor.sm_a546e_proximity_sensor
      - sensor.sm_a546e_screen_brightness

      # Network connectivity
      - sensor.sm_a546e_network_type
      - sensor.sm_a546e_wi_fi_link_speed
      - sensor.sm_a546e_mobile_rx_gb
      - sensor.sm_a546e_mobile_tx_gb
      - sensor.sm_a546e_total_rx_gb
      - sensor.sm_a546e_total_tx_gb

      # Combined template sensors
      - sensor.combined_solar_power
      - sensor.combined_battery_soc
      - sensor.total_grid_import
      - sensor.total_grid_export
      - sensor.daily_solar_generation_combined
      - sensor.energy_independence_percentage

      # Battery efficiency
      - sensor.battery_efficiency_master
      - sensor.battery_efficiency_slave

      # Helper input numbers
      - input_number.prepaid_meter_units
      - input_number.prepaid_meter_actual_balance
      - input_number.prepaid_meter_grid_import_baseline
      - input_number.prepaid_meter_calibration_factor