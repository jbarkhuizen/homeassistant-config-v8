              {% elif v >= 100 %}
                <tr>
                  <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#111827;">{{ name }}</td>
                  <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#c2410c; font-weight:600; text-align:right;">{{ v }} W</td>
