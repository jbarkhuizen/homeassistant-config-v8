      - variables:
          ingress_url: "{{ states('input_text.grafana_ingress_base_url') }}/d/home-energy-weekly/home-energy-weekly"
          grid_weekly: "{{ states('sensor.energy_report_grid_weekly_friendly') | float(0) }}"
          report_date: "{{ now().strftime('%Y-%m-%d') }}"
          report_title: "Home Energy Weekly Report | {{ report_date }}"
          report_message: >
