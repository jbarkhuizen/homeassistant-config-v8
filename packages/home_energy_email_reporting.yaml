            Period
            This week and recent weekly trend

            Grid energy total
            {{ 'No usage' if grid_weekly == 0 else grid_weekly ~ ' kWh' }}

            Open in Home Assistant
            {{ ingress_url }}

            Sent by Home Assistant at {{ now().strftime('%H:%M') }}
          report_html: >
            <html>
              <body>
                <h2>Home Energy Weekly Report</h2>
                <p><b>Date</b><br>{{ report_date }}</p>
                <p><b>Period</b><br>This week and recent weekly trend</p>
                <p><b>Grid energy total</b><br>{{ 'No usage' if grid_weekly == 0 else grid_weekly ~ ' kWh' }}</p>
                <p><b>Open in Home Assistant</b><br>
                <a href="{{ ingress_url }}">{{ ingress_url }}</a></p>
                <p>Sent by Home Assistant at {{ now().strftime('%H:%M') }}</p>
              </body>
            </html>
      - action: notify.email_ha
        data:
          title: "{{ report_title }}"
          message: "{{ report_message }}"
          data:
            html: "{{ report_html }}"
      - action: script.energy_email_update_status
        data:
          report_type: "Weekly"
          status_text: "Sent successfully"

  energy_email_monthly_report:
    alias: Energy Email Monthly Report
    mode: single
    sequence:
      - variables:
          ingress_url: "{{ states('input_text.grafana_ingress_base_url') }}/d/home-energy-monthly/home-energy-monthly"
          grid_monthly: "{{ states('sensor.energy_report_grid_monthly_friendly') | float(0) }}"
          report_date: "{{ now().strftime('%Y-%m-%d') }}"
          report_title: "Home Energy Monthly Report | {{ report_date }}"
          report_message: >
            Home Energy Monthly Report

            Date
            {{ report_date }}

            Period
            This month and recent monthly trend

            Grid energy total
            {{ 'No usage' if grid_monthly == 0 else grid_monthly ~ ' kWh' }}

            Open in Home Assistant
            {{ ingress_url }}

            Sent by Home Assistant at {{ now().strftime('%H:%M') }}
          report_html: >
            <html>
              <body>
                <h2>Home Energy Monthly Report</h2>
                <p><b>Date</b><br>{{ report_date }}</p>
                <p><b>Period</b><br>This month and recent monthly trend</p>
                <p><b>Grid energy total</b><br>{{ 'No usage' if grid_monthly == 0 else grid_monthly ~ ' kWh' }}</p>
                <p><b>Open in Home Assistant</b><br>
                <a href="{{ ingress_url }}">{{ ingress_url }}</a></p>
                <p>Sent by Home Assistant at {{ now().strftime('%H:%M') }}</p>
              </body>
            </html>
      - action: notify.email_ha
        data:
          title: "{{ report_title }}"
          message: "{{ report_message }}"
          data:
            html: "{{ report_html }}"
      - action: script.energy_email_update_status
        data:
          report_type: "Monthly"
          status_text: "Sent successfully"

automation:
  - id: energy_hourly_email_report
    alias: Energy Hourly Email Report
    description: Sends the last 24 hours grid and load report every day at 07:00
    trigger:
      - platform: time
        at: "07:00:00"
    condition: []
    action:
      - action: script.energy_email_hourly_report
    mode: single

  - id: energy_daily_email_report
    alias: Energy Daily Email Report
    description: Sends the daily grid and load report every day at 07:30
    trigger:
      - platform: time
        at: "07:30:00"
    condition: []
    action:
      - action: script.energy_email_daily_report
    mode: single

  - id: energy_weekly_email_report
    alias: Energy Weekly Email Report
    description: Sends the weekly grid report every Sunday at 08:00
    trigger:
      - platform: time
        at: "08:00:00"
    condition:
      - condition: time
        weekday:
          - sun
    action:
      - action: script.energy_email_weekly_report
    mode: single

  - id: energy_monthly_email_report
    alias: Energy Monthly Email Report
    description: Sends the monthly grid report on the 1st day of each month at 08:30
    trigger:
      - platform: time
        at: "08:30:00"
    condition:
      - condition: template
        value_template: "{{ now().day == 1 }}"
    action:
      - action: script.energy_email_monthly_report
    mode: single