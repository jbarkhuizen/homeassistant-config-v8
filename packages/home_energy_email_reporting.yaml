          sent_time: "{{ now().strftime('%H:%M') }}"
          grid_energy_usage: "{{ (states('sensor.main_eskom_switch_monthly') | float(0)) | round(2) }}"
          grid_power_now: "{{ (states('sensor.main_eskom_switch_power') | float(0)) | round(2) }}"
          main_pc_setup_power: "{{ (states('sensor.main_pc_setup_power') | float(0)) | round(2) }}"
          printers_router_power: "{{ (states('sensor.printers_router_power') | float(0)) | round(2) }}"
          printers_3d_power: "{{ (states('sensor.3d_printers_power') | float(0)) | round(2) }}"
          borehole_power: "{{ (states('sensor.boorgat_power') | float(0)) | round(2) }}"
          pool_outbuilding_power: "{{ (states('sensor.db_switch_pool_outbuilding_power') | float(0)) | round(2) }}"
          geyser_external_power: "{{ (states('sensor.geyser_external_power') | float(0)) | round(2) }}"
          geyser_indoor_power: "{{ (states('sensor.geyser_indoor_power') | float(0)) | round(2) }}"
          laundry_power: "{{ (states('sensor.laundry_power') | float(0)) | round(2) }}"
          plugs_1_power: "{{ (states('sensor.plugs_1_power') | float(0)) | round(2) }}"
          plugs_2_power: "{{ (states('sensor.plugs_2_power') | float(0)) | round(2) }}"
          plugs_3_power: "{{ (states('sensor.plugs_3_power') | float(0)) | round(2) }}"
          plugs_kas_power: "{{ (states('sensor.plugs_kas_power_2') | float(0)) | round(2) }}"
          top_floor_power: "{{ (states('sensor.top_floor_power') | float(0)) | round(2) }}"
          woonstel_power: "{{ (states('sensor.woonstel_power') | float(0)) | round(2) }}"
          sonoff_10009ce3f9_power: "{{ (states('sensor.sonoff_10009ce3f9_power') | float(0)) | round(2) }}"
          sonoff_1000cd8453_power: "{{ (states('sensor.sonoff_1000cd8453_power') | float(0)) | round(2) }}"
          sonoff_10023b8a40_power: "{{ (states('sensor.sonoff_10023b8a40_power') | float(0)) | round(2) }}"
          monitored_load_total: >
            {{
              (
                states('sensor.main_pc_setup_power') | float(0) +
                states('sensor.printers_router_power') | float(0) +
                states('sensor.3d_printers_power') | float(0) +
                states('sensor.boorgat_power') | float(0) +
                states('sensor.db_switch_pool_outbuilding_power') | float(0) +
                states('sensor.geyser_external_power') | float(0) +
                states('sensor.geyser_indoor_power') | float(0) +
                states('sensor.laundry_power') | float(0) +
                states('sensor.plugs_1_power') | float(0) +
                states('sensor.plugs_2_power') | float(0) +
                states('sensor.plugs_3_power') | float(0) +
                states('sensor.plugs_kas_power_2') | float(0) +
                states('sensor.top_floor_power') | float(0) +
                states('sensor.woonstel_power') | float(0) +
                states('sensor.sonoff_10009ce3f9_power') | float(0) +
                states('sensor.sonoff_1000cd8453_power') | float(0) +
                states('sensor.sonoff_10023b8a40_power') | float(0)
              ) | round(2)
            }}
          loads_html: >
            {% macro render_load(name, value) %}
              {% set v = value | float(0) %}
              {% if v == 0 %}
                <tr>
                  <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#6b7280;">{{ name }}</td>
                  <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#9ca3af; text-align:right;">No usage</td>
                </tr>
              {% elif v > 500 %}
                <tr>
                  <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#111827; font-weight:600;">{{ name }}</td>
                  <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#b91c1c; font-weight:700; text-align:right;">{{ v }} W</td>
                </tr>
              {% elif v >= 100 %}
                <tr>
                  <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#111827;">{{ name }}</td>
                  <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#c2410c; font-weight:600; text-align:right;">{{ v }} W</td>
                </tr>
              {% else %}
                <tr>
                  <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#111827;">{{ name }}</td>
                  <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#374151; text-align:right;">{{ v }} W</td>
                </tr>
              {% endif %}
            {% endmacro %}
            <table style="width:100%; border-collapse:collapse; font-family:Arial, sans-serif; font-size:14px;">
              <tr>
                <th style="text-align:left; padding:8px 10px; background:#f3f4f6; color:#111827; border-bottom:2px solid #d1d5db;">Device</th>
                <th style="text-align:right; padding:8px 10px; background:#f3f4f6; color:#111827; border-bottom:2px solid #d1d5db;">Current Load</th>
              </tr>
              {{ render_load('Main PC Setup', main_pc_setup_power) }}
              {{ render_load('Printers and Router', printers_router_power) }}
              {{ render_load('3D Printers', printers_3d_power) }}
              {{ render_load('Borehole', borehole_power) }}
              {{ render_load('Pool Outbuilding DB', pool_outbuilding_power) }}
              {{ render_load('External Geyser', geyser_external_power) }}
              {{ render_load('Indoor Geyser', geyser_indoor_power) }}
              {{ render_load('Laundry', laundry_power) }}
              {{ render_load('Plugs 1', plugs_1_power) }}
              {{ render_load('Plugs 2', plugs_2_power) }}
              {{ render_load('Plugs 3', plugs_3_power) }}
              {{ render_load('Plugs Cabinet', plugs_kas_power) }}
              {{ render_load('Top Floor', top_floor_power) }}
              {{ render_load('Apartment', woonstel_power) }}
              {{ render_load('Sonoff 10009CE3F9', sonoff_10009ce3f9_power) }}
              {{ render_load('Sonoff 1000CD8453', sonoff_1000cd8453_power) }}
              {{ render_load('Sonoff 10023B8A40', sonoff_10023b8a40_power) }}
            </table>
          monthly_history_table_html: >
            {% set labels_raw = states('input_text.energy_monthly_history_labels') %}
            {% set labels = labels_raw.split('|') if labels_raw not in ['unknown', 'unavailable', '', none] else [] %}

            {% set row_map = [
              ('Grid Energy Usage', states('input_text.energy_monthly_history_row_grid_energy_usage')),
              ('Main Eskom Switch', states('input_text.energy_monthly_history_row_main_eskom_switch')),
              ('Main PC Setup', states('input_text.energy_monthly_history_row_main_pc_setup')),
              ('3D Printers', states('input_text.energy_monthly_history_row_d_printers')),
              ('Borehole', states('input_text.energy_monthly_history_row_boorgat')),
              ('DB Switch Pool Outbuilding', states('input_text.energy_monthly_history_row_db_switch_pool_outbuilding')),
              ('Geyser External', states('input_text.energy_monthly_history_row_geyser_external')),
              ('Geyser Indoor', states('input_text.energy_monthly_history_row_geyser_indoor')),
              ('Laundry', states('input_text.energy_monthly_history_row_laundry')),
              ('Plugs 1', states('input_text.energy_monthly_history_row_plugs_1')),
              ('Plugs 2', states('input_text.energy_monthly_history_row_plugs_2')),
              ('Plugs 3', states('input_text.energy_monthly_history_row_plugs_3')),
              ('Plugs Cabinet', states('input_text.energy_monthly_history_row_plugs_kas')),
              ('Printers and Router', states('input_text.energy_monthly_history_row_printers_router')),
              ('Top Floor', states('input_text.energy_monthly_history_row_top_floor')),
              ('Apartment', states('input_text.energy_monthly_history_row_woonstel')),
              ('Sonoff 10009CE3F9', states('input_text.energy_monthly_history_row_sonoff_10009ce3f9')),
              ('Sonoff 1000CD8453', states('input_text.energy_monthly_history_row_sonoff_1000cd8453')),
              ('Sonoff 10023B8A40', states('input_text.energy_monthly_history_row_sonoff_10023b8a40'))
            ] %}

            {% macro render_cell(value) %}
              {% set v = value | trim %}
              {% if v in ['', none] %}
                <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#d1d5db; text-align:right;">—</td>
              {% elif v == 'unknown' %}
                <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#9ca3af; font-style:italic; text-align:right;">unknown</td>
              {% elif v | float(0) == 0 %}
                <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#9ca3af; text-align:right;">0.00</td>
              {% elif v | float(0) >= 50 %}
                <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#b91c1c; font-weight:700; text-align:right;">{{ (v | float(0)) | round(2) }}</td>
              {% else %}
                <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#374151; text-align:right;">{{ (v | float(0)) | round(2) }}</td>
              {% endif %}
            {% endmacro %}

            <div style="margin-top:24px;">
              <h3 style="margin:0 0 12px 0; color:#111827; font-size:18px;">Previous 6 Months Usage History</h3>
              <p style="margin:0 0 14px 0; color:#6b7280; font-size:13px;">
                Monthly energy usage in kWh. Newest month appears first.
              </p>
              <div style="overflow-x:auto;">
                <table style="width:100%; min-width:900px; border-collapse:collapse; font-family:Arial, sans-serif; font-size:13px;">
                  <tr>
                    <th style="text-align:left; padding:8px 10px; background:#f3f4f6; color:#111827; border-bottom:2px solid #d1d5db;">Device</th>
                    {% for label in labels %}
                      <th style="text-align:right; padding:8px 10px; background:#f3f4f6; color:#111827; border-bottom:2px solid #d1d5db;">{{ label }}</th>
                    {% endfor %}
                  </tr>
                  {% for row_name, row_state in row_map %}
                    {% set values = row_state.split('|') if row_state not in ['unknown', 'unavailable', '', none] else [] %}
                    <tr>
                      <td style="padding:8px 10px; border-bottom:1px solid #e5e7eb; color:#111827; font-weight:600;">{{ row_name }}</td>
                      {% for i in range(labels | length) %}
                        {% set cell_value = values[i] if i < values | length else '' %}
                        {{ render_cell(cell_value) }}
                      {% endfor %}
                    </tr>
                  {% endfor %}
                </table>
              </div>
            </div>
          report_title: "{{ report_name }} | {{ report_date }}"
          report_message: >
            {{ report_name }}

            Date
            {{ report_date }}

            Period
            {{ period_label }}

            Grid Energy Usage
            {{ 'No usage' if grid_energy_usage == 0 else grid_energy_usage ~ ' kWh' }}

            Current Monitored Load Total
            {{ 'No usage' if monitored_load_total == 0 else monitored_load_total ~ ' W' }}

            Grid Power Now
            {{ 'No usage' if grid_power_now == 0 else grid_power_now ~ ' W' }}

            Open in Home Assistant
            {{ ingress_url }}

            Sent by Home Assistant at {{ sent_time }}
          report_html: >
            <html>
              <body style="margin:0; padding:0; background-color:#f3f4f6; font-family:Arial, sans-serif;">
                <div style="max-width:760px; margin:0 auto; padding:24px;">
                  <div style="background:#ffffff; border:1px solid #e5e7eb; border-radius:14px; overflow:hidden;">
                    <div style="background:#111827; color:#ffffff; padding:20px 24px;">
                      <h2 style="margin:0; font-size:24px;">{{ report_name }}</h2>
                      <p style="margin:8px 0 0 0; font-size:14px; color:#d1d5db;">{{ report_date }} | {{ period_label }}</p>
                    </div>
                    <div style="padding:24px;">
                      <table style="width:100%; border-collapse:separate; border-spacing:12px;">
                        <tr>
                          <td style="width:33.3%; background:#f9fafb; border:1px solid #e5e7eb; border-radius:12px; padding:16px; vertical-align:top;">
                            <div style="font-size:12px; color:#6b7280; text-transform:uppercase;">Grid Energy Usage</div>
                            <div style="margin-top:8px; font-size:24px; font-weight:700; color:#111827;">
                              {{ 'No usage' if grid_energy_usage == 0 else grid_energy_usage ~ ' kWh' }}
                            </div>
                          </td>
                          <td style="width:33.3%; background:#f9fafb; border:1px solid #e5e7eb; border-radius:12px; padding:16px; vertical-align:top;">
                            <div style="font-size:12px; color:#6b7280; text-transform:uppercase;">Current Monitored Load Total</div>
                            <div style="margin-top:8px; font-size:24px; font-weight:700; color:#111827;">
                              {{ 'No usage' if monitored_load_total == 0 else monitored_load_total ~ ' W' }}
                            </div>
                          </td>
                          <td style="width:33.3%; background:#f9fafb; border:1px solid #e5e7eb; border-radius:12px; padding:16px; vertical-align:top;">
                            <div style="font-size:12px; color:#6b7280; text-transform:uppercase;">Grid Power Now</div>
                            <div style="margin-top:8px; font-size:24px; font-weight:700; color:#111827;">
                              {{ 'No usage' if grid_power_now == 0 else grid_power_now ~ ' W' }}
                            </div>
                          </td>
                        </tr>
                      </table>
                      <div style="margin-top:20px;">
                        <h3 style="margin:0 0 12px 0; color:#111827; font-size:18px;">Current Monitored Loads</h3>
                        <p style="margin:0 0 14px 0; color:#6b7280; font-size:13px;">
                          Red highlights highest usage. Orange shows medium usage. Gray shows no usage.
                        </p>
                        {{ loads_html }}
                      </div>
                      {{ monthly_history_table_html }}
                      <div style="margin-top:24px; padding-top:20px; border-top:1px solid #e5e7eb;">
                        <div style="font-size:14px; color:#111827; margin-bottom:8px; font-weight:600;">Open in Home Assistant</div>
                        <a href="{{ ingress_url }}" style="color:#2563eb; text-decoration:none; word-break:break-all;">{{ ingress_url }}</a>
                      </div>
                    </div>
                    <div style="background:#f9fafb; border-top:1px solid #e5e7eb; padding:14px 24px; color:#6b7280; font-size:12px;">
                      Sent by Home Assistant at {{ sent_time }}
                    </div>
                  </div>
                </div>
              </body>
            </html>
      - action: notify.email_ha
        data:
          title: "{{ report_title }}"
          message: "{{ report_message }}"
          data:
            html: "{{ report_html }}"
      - action: script.energy_email_update_status
        data:
          report_type: "Monthly"
          status_text: "Sent successfully"

automation:
  - id: energy_hourly_email_report
    alias: Energy Hourly Email Report
    description: Sends the last 24 hours grid and monitored load report every day at 07:00
    trigger:
      - platform: time
        at: "07:00:00"
    condition: []
    action:
      - action: script.energy_email_hourly_report
    mode: single

  - id: energy_daily_email_report
    alias: Energy Daily Email Report
    description: Sends the daily grid and monitored load report every day at 07:30
    trigger:
      - platform: time
        at: "07:30:00"
    condition: []
    action:
      - action: script.energy_email_daily_report
    mode: single

  - id: energy_weekly_email_report
    alias: Energy Weekly Email Report
    description: Sends the weekly grid and monitored load report every Sunday at 08:00
    trigger:
      - platform: time
        at: "08:00:00"
    condition:
      - condition: time
        weekday:
          - sun
    action:
      - action: script.energy_email_weekly_report
    mode: single

  - id: energy_monthly_email_report
    alias: Energy Monthly Email Report
    description: Sends the monthly grid and monitored load report on the 1st day of each month at 08:30
    trigger:
      - platform: time
        at: "08:30:00"
    condition:
      - condition: template
        value_template: "{{ now().day == 1 }}"
    action:
      - action: script.energy_email_monthly_report
    mode: single