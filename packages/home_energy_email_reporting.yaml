          grid_energy_usage: "{{ (states('sensor.main_eskom_switch_daily') | float(0)) | round(2) }}"
          grid_power_now: "{{ (states('sensor.main_eskom_switch_power') | float(0)) | round(2) }}"
          main_pc_setup_power: "{{ (states('sensor.main_pc_setup_power') | float(0)) | round(2) }}"
          printers_router_power: "{{ (states('sensor.printers_router_power') | float(0)) | round(2) }}"
          printers_3d_power: "{{ (states('sensor.3d_printers_power') | float(0)) | round(2) }}"
