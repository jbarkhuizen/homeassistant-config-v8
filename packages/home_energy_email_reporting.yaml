              {{ render_load('Borehole', borehole_power) }}
              {{ render_load('Pool Outbuilding DB', pool_outbuilding_power) }}
              {{ render_load('External Geyser', geyser_external_power) }}
              {{ render_load('Indoor Geyser', geyser_indoor_power) }}
              {{ render_load('Laundry', laundry_power) }}
              {{ render_load('Plugs 1', plugs_1_power) }}
              {{ render_load('Plugs 2', plugs_2_power) }}
              {{ render_load('Plugs 3', plugs_3_power) }}
              {{ render_load('Plugs Cabinet', plugs_kas_power) }}
              {{ render_load('Top Floor', top_floor_power) }}
              {{ render_load('Apartment', woonstel_power) }}
              {{ render_load('Sonoff 10009CE3F9', sonoff_10009ce3f9_power) }}
              {{ render_load('Sonoff 1000CD8453', sonoff_1000cd8453_power) }}
              {{ render_load('Sonoff 10023B8A40', sonoff_10023b8a40_power) }}
            </table>
