# ==============================================================================
# Prepaid Meter Helpers
# File: packages/prepaid_meter.yaml
# Purpose: Manual prepaid inputs, thresholds, calibration and reporting helpers
# Updated: 2026-05-26
# ==============================================================================

input_number:
  prepaid_meter_units:
    name: Prepaid Meter Units
    min: 0
    max: 100000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
    icon: mdi:counter

  prepaid_meter_grid_import_baseline:
    name: Prepaid Meter Grid Import Baseline
    min: 0
    max: 10000000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
    icon: mdi:transmission-tower-import

  prepaid_meter_actual_balance:
    name: Prepaid Meter Actual Balance
    min: 0
    max: 100000
    step: 0.01
    mode: box
    unit_of_measurement: kWh
    icon: mdi:meter-electric

  prepaid_meter_calibration_factor:
    name: Prepaid Meter Calibration Factor
    min: 0.500
    max: 1.500
    step: 0.001
    mode: box
    unit_of_measurement: x
    icon: mdi:tune
    initial: 1.000

  prepaid_meter_warning_threshold:
    name: Prepaid Meter Warning Threshold
    min: 1
    max: 1000
    step: 1
    mode: box
    unit_of_measurement: kWh
    icon: mdi:alert-outline
    initial: 50

  prepaid_meter_critical_threshold:
    name: Prepaid Meter Critical Threshold
    min: 1
    max: 1000
    step: 1
    mode: box
    unit_of_measurement: kWh
    icon: mdi:alert
    initial: 20

  prepaid_meter_emergency_threshold:
    name: Prepaid Meter Emergency Threshold
    min: 1
    max: 1000
    step: 1
    mode: box
    unit_of_measurement: kWh
    icon: mdi:alert-circle
    initial: 5

input_text:
  prepaid_hourly_snapshot_latest:
    name: Prepaid Hourly Snapshot Latest
    max: 255
    icon: mdi:table-clock

  prepaid_daily_accuracy_snapshot:
    name: Prepaid Daily Accuracy Snapshot
    max: 255
    icon: mdi:clipboard-text-clock

input_boolean:
  prepaid_meter_emergency_mode:
    name: Prepaid Meter Emergency Mode
    icon: mdi:flash-alert

  energy_saving_mode:
    name: Energy Saving Mode
    icon: mdi:leaf