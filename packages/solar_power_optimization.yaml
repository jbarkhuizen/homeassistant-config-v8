# ==============================================================================
# Solar Power Optimization Package
# File: packages/solar_power_optimization.yaml
# Updated: 2026-05-15
# Purpose: Generic solar optimization framework for future high-power devices
# Important:
# - This package no longer controls the pool pump
# - Pool pump control is handled only by:
#   automations/pool_pump_solar_management.yaml
# - Keep this package for future devices you want to automate
# ==============================================================================

# ==============================================================================
# Input Booleans - Enable/Disable Automation
# ==============================================================================
input_boolean:
  solar_optimization_enabled:
    name: Solar Power Optimization Enabled
    initial: on
    icon: mdi:solar-power

# ==============================================================================
# Input Numbers - Adjustable Thresholds
# ==============================================================================
input_number:
  solar_power_threshold_on:
    name: Solar Power ON Threshold
    min: 5000
    max: 15000
    step: 500
    initial: 7000
    unit_of_measurement: "W"
    icon: mdi:lightning-bolt
    mode: box

  solar_power_threshold_off:
    name: Solar Power OFF Threshold
    min: 2000
    max: 10000
    step: 500
    initial: 5000
    unit_of_measurement: "W"
    icon: mdi:lightning-bolt-outline
    mode: box

# ==============================================================================
# Template Sensors - System Status and Monitoring
# ==============================================================================
template:
  - sensor:
      - name: "Solar Optimization Status"
        unique_id: solar_optimization_status
        state: >
          {% if is_state('input_boolean.solar_optimization_enabled', 'on') %}
            {% set current_solar = states('sensor.deyeinvertercombined_solar_power_used') | float(0) %}
            {% set threshold_on = states('input_number.solar_power_threshold_on') | float(0) %}
            {% set threshold_off = states('input_number.solar_power_threshold_off') | float(0) %}
            {% if current_solar >= threshold_on %}
              Active - High Solar ({{ current_solar | round(0) }}W)
            {% elif current_solar >= threshold_off %}
              Active - Medium Solar ({{ current_solar | round(0) }}W)
            {% else %}
              Active - Low Solar ({{ current_solar | round(0) }}W)
            {% endif %}
          {% else %}
            Disabled
          {% endif %}
        icon: >
          {% if is_state('input_boolean.solar_optimization_enabled', 'on') %}
            {% set current_solar = states('sensor.deyeinvertercombined_solar_power_used') | float(0) %}
            {% set threshold_on = states('input_number.solar_power_threshold_on') | float(0) %}
            {% if current_solar >= threshold_on %}
              mdi:solar-power
            {% else %}
              mdi:solar-power-variant
            {% endif %}
          {% else %}
            mdi:solar-power-variant-outline
          {% endif %}
        attributes:
          current_solar_power: >
            {{ states('sensor.deyeinvertercombined_solar_power_used') | float(0) | round(0) }}
          threshold_on: >
            {{ states('input_number.solar_power_threshold_on') | float(0) | round(0) }}
          threshold_off: >
            {{ states('input_number.solar_power_threshold_off') | float(0) | round(0) }}
          operating_hours: "Reserved for future generic solar-managed devices"

# ==============================================================================
# Automations - Generic Solar Control Placeholder
# ==============================================================================
automation:
  - id: "solar_power_manual_override_alert"
    alias: "Solar Power - Manual Override Alert"
    description: "Notifies when generic solar automation is manually disabled"
    trigger:
      - platform: state
        entity_id: input_boolean.solar_optimization_enabled
        to: "off"
    actions:
      - service: notify.email_alerts_jbarkhuizen_gmail_com
        data:
          title: "⚠️ Solar Power Optimization"
          message: >-
            Generic solar optimization has been manually disabled at
            {{ now().strftime('%H:%M') }}.

            No generic devices will be automatically controlled until re-enabled.

            Pool pump automation is separate and remains controlled by its
            dedicated pool pump automation file.

      - service: telegram_bot.send_message
        data:
          chat_id: !secret telegram_chat_id_2
          message: >-
            ⚠️ *Solar Power Optimization*

            Generic solar optimization disabled at {{ now().strftime('%H:%M') }}.

            Pool pump control remains separate.
          parse_mode: markdown

      - service: notify.mobile_app_sm_g996b
        data:
          title: "⚠️ Solar Power Optimization"
          message: >-
            Generic solar optimization disabled at {{ now().strftime('%H:%M') }}.
            Pool pump control remains separate.
          data:
            channel: "Solar Optimization"
            importance: high
            group: "ha-solar-optimization"
            color: "#FF9800"
            actions:
              - action: "OPEN_HA"
                title: "Open HA"
                uri: "http://192.168.1.31:8123"

      - service: persistent_notification.create
        data:
          title: "⚠️ Solar Power Optimization"
          message: >-
            Generic solar optimization has been manually disabled at
            {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

            No generic devices will be automatically controlled until re-enabled.

            Pool pump automation is separate and remains controlled by its
            dedicated pool pump automation file.
          notification_id: "solar_power_manual_override_alert"

    mode: single

# ==============================================================================
# End of Solar Power Optimization Package
# ==============================================================================