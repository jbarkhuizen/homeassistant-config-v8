#===============================================================================
# SYSTEM HEALTH MONITORING PACKAGE
# File: packages/system_health_monitoring.yaml
# Updated: 2026-05-01
# Purpose: Monitor Home Assistant system performance and send alerts
# Monitors: CPU, Memory, Disk Space, Database Size, Recorder Performance
# Channels: Email | Telegram | Mobile Push (SM-G996B) | Persistent | System Log
#===============================================================================

#===============================================================================
# TEMPLATE SENSORS - System Health Metrics
#===============================================================================
template:
  - sensor:
      # CPU Status Sensor with Color Coding
      - name: "System CPU Status"
        unique_id: system_cpu_status
        state: >
          {% set cpu = states('sensor.home_assistant_supervisor_cpu_percent') | float(0) %}
          {% if cpu < 50 %}
            Normal
          {% elif cpu < 70 %}
            Moderate
          {% elif cpu < 85 %}
            High
          {% else %}
            Critical
          {% endif %}
        attributes:
          cpu_percent: "{{ states('sensor.home_assistant_supervisor_cpu_percent') }}"
          status_color: >
            {% set cpu = states('sensor.home_assistant_supervisor_cpu_percent') | float(0) %}
            {% if cpu < 50 %}
              green
            {% elif cpu < 70 %}
              yellow
            {% elif cpu < 85 %}
              orange
            {% else %}
              red
            {% endif %}
          last_updated: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        icon: >
          {% set cpu = states('sensor.home_assistant_supervisor_cpu_percent') | float(0) %}
          {% if cpu < 50 %}
            mdi:chip
          {% elif cpu < 70 %}
            mdi:alert-circle-outline
          {% else %}
            mdi:alert-octagon
          {% endif %}

      # Memory Status Sensor
      - name: "System Memory Status"
        unique_id: system_memory_status
        state: >
          {% set mem = states('sensor.memory_use_percent') | float(0) %}
          {% if mem < 70 %}
            Normal
          {% elif mem < 85 %}
            High
          {% else %}
            Critical
          {% endif %}
        attributes:
          memory_percent: "{{ states('sensor.memory_use_percent') }}"
          status_color: >
            {% set mem = states('sensor.memory_use_percent') | float(0) %}
            {% if mem < 70 %}
              green
            {% elif mem < 85 %}
              orange
            {% else %}
              red
            {% endif %}
        icon: >
          {% set mem = states('sensor.memory_use_percent') | float(0) %}
          {% if mem < 70 %}
            mdi:memory
          {% else %}
            mdi:alert-octagon
          {% endif %}

      # Overall System Health Score
      - name: "System Health Score"
        unique_id: template_system_health_score_v1
        state: >
          {% set cpu = states('sensor.home_assistant_supervisor_cpu_percent') | float(0) %}
          {% set mem = states('sensor.memory_use_percent') | float(0) %}
          {% set disk = states('sensor.disk_use_percent') | float(0) %}
          {% set score = 100 %}
          {% if cpu > 80 %}
            {% set score = score - 30 %}
          {% elif cpu > 60 %}
            {% set score = score - 15 %}
          {% endif %}
          {% if mem > 85 %}
            {% set score = score - 30 %}
          {% elif mem > 70 %}
            {% set score = score - 15 %}
          {% endif %}
          {% if disk > 85 %}
            {% set score = score - 20 %}
          {% elif disk > 75 %}
            {% set score = score - 10 %}
          {% endif %}
          {{ score }}
        unit_of_measurement: "%"
        attributes:
          rating: >
            {% set score = states('sensor.system_health_score') | float(100) %}
            {% if score >= 90 %}
              Excellent
            {% elif score >= 75 %}
              Good
            {% elif score >= 60 %}
              Fair
            {% elif score >= 40 %}
              Poor
            {% else %}
              Critical
            {% endif %}
          cpu_contribution: "{{ states('sensor.home_assistant_supervisor_cpu_percent') }}%"
          memory_contribution: "{{ states('sensor.memory_use_percent') }}%"
          disk_contribution: "{{ states('sensor.disk_use_percent') }}%"
        icon: mdi:heart-pulse

  - binary_sensor:
      # Critical System Alert Sensor
      - name: "System Health Critical"
        unique_id: system_health_critical
        state: >
          {% set cpu = states('sensor.home_assistant_supervisor_cpu_percent') | float(0) %}
          {% set mem = states('sensor.memory_use_percent') | float(0) %}
          {% set disk = states('sensor.disk_use_percent') | float(0) %}
          {{ cpu > 90 or mem > 90 or disk > 90 }}
        device_class: problem
        attributes:
          issues: >
            {% set issues = [] %}
            {% set cpu = states('sensor.home_assistant_supervisor_cpu_percent') | float(0) %}
            {% set mem = states('sensor.memory_use_percent') | float(0) %}
            {% set disk = states('sensor.disk_use_percent') | float(0) %}
            {% if cpu > 90 %}
              {% set issues = issues + ['CPU Critical: ' ~ cpu ~ '%'] %}
            {% endif %}
            {% if mem > 90 %}
              {% set issues = issues + ['Memory Critical: ' ~ mem ~ '%'] %}
            {% endif %}
            {% if disk > 90 %}
              {% set issues = issues + ['Disk Critical: ' ~ disk ~ '%'] %}
            {% endif %}
            {{ issues | join(', ') if issues else 'None' }}

#===============================================================================
# AUTOMATIONS - System Health Monitoring
#===============================================================================
automation:
  #-----------------------------------------------------------------------------
  # HIGH CPU USAGE ALERT - Immediate Response
  #-----------------------------------------------------------------------------
  - id: system_high_cpu_usage_alert
    alias: "System Health: High CPU Usage Alert"
    description: "Send alert when CPU usage exceeds 80% for 5 minutes via all channels"

    trigger:
      - platform: numeric_state
        entity_id: sensor.home_assistant_supervisor_cpu_percent
        above: 80
        for:
          minutes: 5

    condition: []

    action:
      # --- Telegram ---
      - service: telegram_bot.send_message
        data:
          chat_id: !secret telegram_chat_id_2
          message: |
            🔴 *HIGH CPU USAGE ALERT*

            ⚠️ *System Performance Issue Detected*

            📊 *Current Metrics:*
            🖥️ CPU Usage: {{ states('sensor.home_assistant_supervisor_cpu_percent') }}%
            🧠 Memory: {{ states('sensor.memory_use_percent') }}%
            💾 Disk: {{ states('sensor.disk_use_percent') }}%

            ⏱️ *Duration:* 5+ minutes
            🏥 *Health Score:* {{ states('sensor.system_health_score') }}/100

            *Recommended Actions:*
            • Check running add-ons in Supervisor
            • Review recent automations/integrations
            • Check system logs for errors
            • Consider restarting HA if issue persists

            🌐 IP: 192.168.1.31:8123
            📅 {{ now().strftime('%A, %d %B %Y %H:%M') }}
          parse_mode: markdown

      # --- Email ---
      - service: notify.email_alerts_jbarkhuizen_gmail_com
        data:
          title: "🔴 Home Assistant - High CPU Usage Alert"
          message: >
            HIGH CPU USAGE DETECTED

            Your Home Assistant system is experiencing high CPU usage.

            Current CPU Usage: {{ states('sensor.home_assistant_supervisor_cpu_percent') }}%
            Duration: 5+ minutes
            Memory Usage: {{ states('sensor.memory_use_percent') }}%
            Disk Usage: {{ states('sensor.disk_use_percent') }}%
            System Health Score: {{ states('sensor.system_health_score') }}/100

            RECOMMENDED ACTIONS:
            1. Check Supervisor for resource-intensive add-ons
            2. Review recent automation changes
            3. Check system logs for errors
            4. Consider restarting if issue persists

            Time: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
            IP: 192.168.1.31:8123

      # --- Mobile Push ---
      - service: notify.mobile_app_sm_g996b
        data:
          title: "🔴 High CPU Usage Alert"
          message: "CPU: {{ states('sensor.home_assistant_supervisor_cpu_percent') }}% for 5+ min | Memory: {{ states('sensor.memory_use_percent') }}% | Disk: {{ states('sensor.disk_use_percent') }}% | Health Score: {{ states('sensor.system_health_score') }}/100"
          data:
            channel: "System Health"
            importance: high
            group: "ha-system-health"
            color: "#F44336"
            actions:
              - action: "OPEN_HA"
                title: "Open HA"
                uri: "http://192.168.1.31:8123"

      # --- Persistent Notification ---
      - service: persistent_notification.create
        data:
          title: "🔴 High CPU Usage Alert"
          message: >-
            High CPU usage detected at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

            🖥️ CPU: {{ states('sensor.home_assistant_supervisor_cpu_percent') }}% (5+ minutes)
            🧠 Memory: {{ states('sensor.memory_use_percent') }}%
            💾 Disk: {{ states('sensor.disk_use_percent') }}%
            🏥 Health Score: {{ states('sensor.system_health_score') }}/100

            Recommended:
            • Check Supervisor for resource-intensive add-ons
            • Review recent automation changes
            • Check system logs for errors
          notification_id: "system_high_cpu_alert"

      # --- System Log ---
      - service: system_log.write
        data:
          message: "High CPU usage detected: {{ states('sensor.home_assistant_supervisor_cpu_percent') }}% for 5+ minutes. Memory: {{ states('sensor.memory_use_percent') }}%, Disk: {{ states('sensor.disk_use_percent') }}%."
          level: warning

    mode: single

