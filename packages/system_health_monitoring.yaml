            🧠 Memory: {{ states('sensor.memory_use_percent') }}%
            🏥 Health Score: {{ states('sensor.system_health_score') }}/100

            Recommended:
            • Delete old backups
            • Reduce recorder database retention
            • Check for large log files in /config
            • Remove unused add-ons
          notification_id: "system_high_disk_alert"

      # --- System Log ---
      - service: system_log.write
        data:
          message: "High disk usage: {{ states('sensor.disk_use_percent') }}%. CPU: {{ states('sensor.home_assistant_supervisor_cpu_percent') }}%, Memory: {{ states('sensor.memory_use_percent') }}%, Health Score: {{ states('sensor.system_health_score') }}/100."
