script:
  energy_daily_history_snapshot:
    alias: Energy Daily History Snapshot
    mode: single
    sequence:
      - variables:
          today_label: "{{ now().strftime('%d %b') }}"
          existing_labels_raw: "{{ states('input_text.energy_daily_history_labels') }}"
          existing_labels: >
            {% set items = existing_labels_raw.split('|') if existing_labels_raw not in ['unknown', 'unavailable', '', none] else [] %}
            {{ items }}
          first_label: >
            {% set items = existing_labels_raw.split('|') if existing_labels_raw not in ['unknown', 'unavailable', '', none] else [] %}
            {{ items[0] if items | length > 0 else '' }}
          is_same_day: "{{ first_label == today_label }}"

          current_grid_energy_usage: >
            {% set v = states('sensor.main_eskom_switch_daily') %}
            {{ (v | float(0) | round(2)) if is_number(v) else 'unknown' }}

          current_main_eskom_switch: >
            {% set v = states('sensor.main_eskom_switch_daily') %}
            {{ (v | float(0) | round(2)) if is_number(v) else 'unknown' }}

          current_main_pc_setup: >
            {% set v = states('sensor.main_pc_setup_daily') %}
            {{ (v | float(0) | round(2)) if is_number(v) else 'unknown' }}

          current_d_printers: >
            {% set v = states('sensor.3d_printers_daily') %}
            {{ (v | float(0) | round(2)) if is_number(v) else 'unknown' }}

          current_boorgat: >
