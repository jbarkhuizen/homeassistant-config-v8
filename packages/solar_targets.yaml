input_number:
  solar_generation_target:
    name: Solar Generation Target
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: kWh
    mode: box
    icon: mdi:target

template:
  - sensor:
      - name: "Solar Combined PV Total Today"
        unique_id: solar_combined_pv_total_today
        unit_of_measurement: kWh
        icon: mdi:solar-power
        state: >
          {{
            (
              states('sensor.deyeinvertermaster_summary_day_pv1') | float(0)
              + states('sensor.deyeinvertermaster_summary_day_pv2') | float(0)
            ) | round(2)
          }}

      - name: "Solar Generation Target Progress"
        unique_id: solar_generation_target_progress
        unit_of_measurement: "%"
        icon: mdi:chart-gauge
        state: >
          {% set total = states('sensor.solar_combined_pv_total_today') | float(0) %}
          {% set target = states('input_number.solar_generation_target') | float(0) %}
          {% if target > 0 %}
            {{ ((total / target) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
        attributes:
          total_today_kwh: >
            {{ states('sensor.solar_combined_pv_total_today') | float(0) | round(2) }}
          target_kwh: >
            {{ states('input_number.solar_generation_target') | float(0) | round(2) }}
          remaining_to_target_kwh: >
            {% set total = states('sensor.solar_combined_pv_total_today') | float(0) %}
            {% set target = states('input_number.solar_generation_target') | float(0) %}
            {{ [target - total, 0] | max | round(2) }}

      - name: "Solar Generation Target Status"
        unique_id: solar_generation_target_status
        icon: mdi:flag-checkered
        state: >
          {% set total = states('sensor.solar_combined_pv_total_today') | float(0) %}
          {% set target = states('input_number.solar_generation_target') | float(0) %}
          {% if target == 0 %}
            No target set
          {% elif total >= target %}
            Target achieved
          {% else %}
            In progress
          {% endif %}
        attributes:
          total_today_kwh: >
            {{ states('sensor.solar_combined_pv_total_today') | float(0) | round(2) }}
          target_kwh: >
            {{ states('input_number.solar_generation_target') | float(0) | round(2) }}