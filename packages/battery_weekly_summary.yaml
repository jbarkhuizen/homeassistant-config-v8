#===============================================================================
# BATTERY: Weekly Summary (Mondays 08:32) — All Channels
# File: automations/battery_weekly_summary.yaml
# Updated: 2026-05-01
# - Requires: templates/battery_weekly_report.jinja and package sensors
# - Guards: Maintenance Mode OFF, Weekly Report switch ON, Monday only
# Channels: Email | Telegram | Mobile Push (SM-G996B) | Persistent | System Log
#===============================================================================
- id: battery_weekly_summary_0832
  alias: "Battery: Weekly Summary (Mon 08:32) — All Channels"
  description: >
    Sends a weekly battery summary (trends + top-5 lowest devices) via Email,
    Telegram, Mobile Push and Persistent Notification on Mondays at 08:32.
    Requires Weekly Battery Report to be enabled and Maintenance Mode OFF.

  trigger:
    - platform: time
      at: "08:32:00"

  condition:
    - condition: state
      entity_id: input_boolean.maintenance_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.battery_weekly_report_enabled
      state: "on"
    - condition: time
      weekday:
        - mon

  action:
    # Slight delay to ensure morning stats are updated
    - delay:
        seconds: 10

    # Variables for Mobile Push and Persistent summary (safe defaults)
    - variables:
        low7: "{{ states('sensor.battery_low_count_change_7d') | float(0) | round(0) }}"
        low14: "{{ states('sensor.battery_low_count_change_14d') | float(0) | round(0) }}"
        low_prev: "{{ ([low14 | float(0) - low7 | float(0), 0] | max) | round(0) }}"
        low_delta: "{{ (low7 | float(0) - low_prev | float(0)) | round(0) }}"
        low_delta_s: "{{ ('+' ~ low_delta | string) if low_delta | float(0) > 0 else (low_delta | string) }}"
        crit7: "{{ states('sensor.battery_critical_count_change_7d') | float(0) | round(0) }}"
        crit14: "{{ states('sensor.battery_critical_count_change_14d') | float(0) | round(0) }}"
        crit_prev: "{{ ([crit14 | float(0) - crit7 | float(0), 0] | max) | round(0) }}"
        crit_delta: "{{ (crit7 | float(0) - crit_prev | float(0)) | round(0) }}"
        crit_delta_s: "{{ ('+' ~ crit_delta | string) if crit_delta | float(0) > 0 else (crit_delta | string) }}"
        total_devices: >-
          {% set v = states('sensor.battery_monitored_device_count') %}
          {% if v in ['unknown','unavailable','None',''] %}N/A{% else %}{{ v }}{% endif %}
        healthy_pct: >-
          {% set tot = states('sensor.battery_monitored_device_count') | float(0) %}
          {% set lo = states('sensor.battery_low_count_change_7d') | float(0) %}
          {% if tot > 0 %}{{ ((tot - lo) / tot * 100) | round(1) }}%{% else %}N/A{% endif %}
        top_low_device: >-
          {% set v = states('sensor.battery_lowest_device_name') %}
          {% if v in ['unknown','unavailable','None',''] %}N/A{% else %}{{ v }}{% endif %}
        top_low_pct: >-
          {% set v = states('sensor.battery_lowest_device_level') %}
          {% if v in ['unknown','unavailable','None',''] %}N/A{% else %}{{ v | float(0) | round(0) }}%{% endif %}
        trend: >-
          {% if low_delta | float(0) < 0 %}Improving ✅
          {% elif low_delta | float(0) > 0 %}Worsening ⚠️
          {% else %}Stable ➡️
          {% endif %}

    # --- Email ---
    - service: notify.email_notification_jbarkhuizen_gmail_com
      data:
        title: "🔋 Battery — Weekly Summary {{ now().strftime('%Y-%m-%d') }}"
        message: >-
          {% from 'battery_weekly_report.jinja' import battery_weekly_email %}
          {{ battery_weekly_email() }}

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        target:
          - !secret telegram_chat_id_2
        message: >-
          {% from 'battery_weekly_report.jinja' import battery_weekly_telegram %}
          {{ battery_weekly_telegram() }}
        parse_mode: markdown

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "🔋 Battery Weekly Summary — {{ now().strftime('%d %b %Y') }}"
        message: >-
          Trend: {{ trend }}
          | Low Δ: {{ low_delta_s }} | Crit Δ: {{ crit_delta_s }}
          | This week: {{ low7 }} low, {{ crit7 }} critical
          | Devices: {{ total_devices }} monitored ({{ healthy_pct }} healthy)
          | Lowest: {{ top_low_device }} @ {{ top_low_pct }}
        data:
          channel: "Battery Reports"
          importance: >-
            {% if crit7 | float(0) > 0 %}high{% else %}default{% endif %}
          group: "ha-battery"
          color: >-
            {% if crit7 | float(0) > 0 %}#F44336
            {% elif low7 | float(0) > 0 %}#FF9800
            {% else %}#4CAF50
            {% endif %}
          icon_url: "https://www.home-assistant.io/images/favicon-192x192-full.png"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "🔋 Battery Weekly Summary (08:32) — {{ now().strftime('%d %b %Y') }}"
        message: >-
          Weekly battery summary sent at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

          📊 Week-on-Week Comparison:
          • Low Battery Events: {{ low7 }} this week vs {{ low_prev }} prior week (Δ {{ low_delta_s }})
          • Critical Battery Events: {{ crit7 }} this week vs {{ crit_prev }} prior week (Δ {{ crit_delta_s }})
          • Overall Trend: {{ trend }}

          🔋 Device Health:
          • Total Monitored Devices: {{ total_devices }}
          • Healthy Devices: {{ healthy_pct }}
          • Lowest Device: {{ top_low_device }} @ {{ top_low_pct }}

          ✅ Email sent — notify.email_notification_jbarkhuizen_gmail_com
          ✅ Telegram sent — chat_id_2
          ✅ Mobile Push sent — SM-G996B
        notification_id: "battery_weekly_summary_0832"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Battery Weekly Summary sent at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
          Low 7d: {{ low7 }} (Δ {{ low_delta_s }}), Critical 7d: {{ crit7 }} (Δ {{ crit_delta_s }}),
          Trend: {{ trend }}, Devices: {{ total_devices }}, Lowest: {{ top_low_device }} @ {{ top_low_pct }}.
          Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent.
        level: info

  mode: single
#===============================================================================
# END OF BATTERY WEEKLY SUMMARY
#===============================================================================