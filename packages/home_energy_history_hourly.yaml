automation:
  - id: energy_hourly_history_snapshot
    alias: Energy Hourly History Snapshot
    description: Stores the latest hourly energy usage values into 12 hour rolling history helpers at the top of every hour
    trigger:
      - platform: time_pattern
        minutes: "0"
    condition: []
    action:
      - action: script.energy_hourly_history_snapshot
    mode: single