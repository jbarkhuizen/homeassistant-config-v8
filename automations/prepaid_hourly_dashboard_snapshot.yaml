# ==============================================================================
# Prepaid Meter Hourly Dashboard Snapshot
# File: automations/prepaid_hourly_dashboard_snapshot.yaml
# Updated: 2026-05-26
# Purpose:
# - Capture prepaid baseline when recharge value is updated
# - Capture latest hourly prepaid and energy dashboard values
# ==============================================================================

- id: prepaid_meter_baseline_capture_on_recharge
  alias: "Prepaid Meter: Capture Grid Import Baseline On Recharge"
  description: "Store the current Deye total grid import reading in kWh when prepaid units are updated"

  trigger:
    - platform: state
      entity_id: input_number.prepaid_meter_units

  condition: []

  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.prepaid_meter_grid_import_baseline
      data:
        value: >
          {{ (states('sensor.deyeinvertercombined_summary_total_grid_import_buy') | float(0) * 1000) | round(2) }}

    - service: system_log.write
      data:
        message: >-
          Prepaid baseline captured at
          {{ (states('sensor.deyeinvertercombined_summary_total_grid_import_buy') | float(0) * 1000) | round(2) }} kWh
          after prepaid units updated to
          {{ states('input_number.prepaid_meter_units') }} kWh.
        level: info

  mode: single

- id: prepaid_hourly_snapshot_capture
  alias: "Prepaid Meter: Hourly Dashboard Snapshot"
  description: "Capture latest hourly prepaid and energy metrics at the top of each hour"

  trigger:
    - platform: time_pattern
      minutes: "0"

  condition: []

  action:
    - service: input_text.set_value
      target:
        entity_id: input_text.prepaid_hourly_snapshot_latest
      data:
        value: >-
          {{ now().strftime('%Y-%m-%d %H:%M') }} |
          Bought: {{ states('input_number.prepaid_meter_units') }} kWh |
          Grid: {{ states('sensor.grid_units_used_this_hour') }} kWh |
          Solar: {{ states('sensor.solar_generated_this_hour') }} kWh |
          Battery: {{ states('sensor.battery_discharged_this_hour') }} kWh |
          Left: {{ states('sensor.prepaid_units_left') }} kWh |
          Variance: {{ states('sensor.prepaid_units_variance') }} kWh

    - service: system_log.write
      data:
        message: >-
          Prepaid hourly snapshot captured at {{ now().strftime('%Y-%m-%d %H:%M') }} |
          Bought={{ states('input_number.prepaid_meter_units') }} kWh |
          Grid={{ states('sensor.grid_units_used_this_hour') }} kWh |
          Solar={{ states('sensor.solar_generated_this_hour') }} kWh |
          Battery={{ states('sensor.battery_discharged_this_hour') }} kWh |
          Left={{ states('sensor.prepaid_units_left') }} kWh |
          Variance={{ states('sensor.prepaid_units_variance') }} kWh
        level: info

  mode: single