#===============================================================================
# SOLAR FORECAST NOTIFICATIONS
# File: automations/solar_forecast_notifications.yaml
# Updated: 2026-05-01
# Purpose: Send solar forecast notifications daily at specific times
# Channels: Email | Telegram | Mobile Push (SM-G996B) | Persistent | System Log
#===============================================================================

#-----------------------------------------------------------------------------
# Automation 1: Daily Solar Forecast Summary (08:08)
#-----------------------------------------------------------------------------
- id: solar_forecast_daily_summary_0808
  alias: "Solar Forecast: Daily Summary 08:08 — All Channels"
  description: >
    Sends a solar forecast daily summary at 08:08 via Email, Telegram, Mobile Push,
    Persistent Notification and System Log. Maintenance Mode OFF required.

  trigger:
    - platform: time
      at: "08:08:00"

  condition:
    - condition: state
      entity_id: input_boolean.maintenance_mode
      state: "off"

  action:
    # Variables for Mobile Push and Persistent summary
    - variables:
        total_today: >-
          {% set v = states('sensor.solar_forecast_total_today') %}
          {% if v in ['unknown','unavailable','None',''] %}N/A{% else %}{{ v | float(0) | round(2) }}{% endif %}
        remaining_today: >-
          {% set v = states('sensor.solar_forecast_remaining_today') %}
          {% if v in ['unknown','unavailable','None',''] %}N/A{% else %}{{ v | float(0) | round(2) }}{% endif %}
        quality: >-
          {% set v = states('sensor.solar_forecast_quality_today') %}
          {% if v in ['unknown','unavailable','None',''] %}Unknown{% else %}{{ v }}{% endif %}
        peak_time: >-
          {% set raw = states('sensor.solar_forecast_peak_time_today') %}
          {% if raw in ['unknown','unavailable','None',''] %}
            N/A
          {% else %}
            {{ as_datetime(raw).strftime('%H:%M') }}
          {% endif %}
        accuracy: >-
          {% set v = states('sensor.solar_forecast_accuracy_so_far') %}
          {% if v in ['unknown','unavailable','None',''] %}N/A{% else %}{{ v | float(0) | round(1) }}%{% endif %}
        recommended_slots: >-
          {% set v = states('sensor.solar_recommended_load_slots_today') %}
          {% if v in ['unknown','unavailable','None',''] %}Unavailable{% else %}{{ v }}{% endif %}
        action_rec: >-
          {% set v = states('sensor.solar_forecast_action_recommendation') %}
          {% if v in ['unknown','unavailable','None',''] %}No recommendation{% else %}{{ v }}{% endif %}
        quality_color: >-
          {% set q = states('sensor.solar_forecast_quality_today') | lower %}
          {% if q == 'high' %}#4CAF50
          {% elif q == 'medium' %}#FF9800
          {% else %}#F44336
          {% endif %}

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "☀️ Solar Forecast Daily Summary (08:08) — {{ now().strftime('%d %b %Y') }}"
        message: >-
          Solar forecast daily summary at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

          ☀️ Forecast Overview:
          • Total Today: {{ total_today }} kWh
          • Remaining Today: {{ remaining_today }} kWh
          • Quality: {{ quality }}
          • Peak Time: {{ peak_time }}
          • Accuracy So Far: {{ accuracy }}
          • Recommended Slots: {{ recommended_slots }}
          • Action: {{ action_rec }}
        notification_id: "solar_forecast_daily"

    # --- Email ---
    - service: notify.email_ha
      data:
        title: "☀️ Solar Forecast — Daily Summary"
        message: >-
          {% from 'solar_forecast_notifications.jinja' import solar_forecast_email_main %}
          {{ solar_forecast_email_main() }}

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_id_2
        message: >-
          {% from 'solar_forecast_notifications.jinja' import solar_forecast_telegram_main %}
          {{ solar_forecast_telegram_main() }}
        parse_mode: markdown

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "☀️ Solar Forecast — {{ now().strftime('%d %b %Y') }} 08:08"
        message: >-
          {{ quality }} day — {{ remaining_today }} kWh remaining (Total {{ total_today }} kWh)
          | Peak: {{ peak_time }} | Accuracy: {{ accuracy }}
          | Action: {{ action_rec }}
        data:
          channel: "Solar Forecast"
          importance: default
          group: "ha-solar-forecast"
          color: "{{ quality_color }}"
          icon_url: "https://www.home-assistant.io/images/favicon-192x192-full.png"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Solar Forecast Daily Summary sent at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
          Quality: {{ quality }}, Total: {{ total_today }} kWh, Remaining: {{ remaining_today }} kWh,
          Peak: {{ peak_time }}, Accuracy: {{ accuracy }}, Action: {{ action_rec }}.
          Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent.
        level: info

  mode: single

#-----------------------------------------------------------------------------
# Automation 2: Low Solar Day Alert (08:10)
#-----------------------------------------------------------------------------
- id: solar_forecast_low_day_alert_0810
  alias: "Solar Forecast: Low Day Alert 08:10 — All Channels"
  description: >
    Sends a low solar day alert at 08:10 if forecast quality is Low and remaining
    energy is below 8 kWh. Sends via Email, Telegram, Mobile Push, Persistent
    Notification and System Log. Maintenance Mode OFF required.

  trigger:
    - platform: time
      at: "08:10:00"

  condition:
    - condition: state
      entity_id: input_boolean.maintenance_mode
      state: "off"
    - condition: template
      value_template: "{{ states('sensor.solar_forecast_quality_today') == 'Low' }}"
    - condition: template
      value_template: "{{ states('sensor.solar_forecast_remaining_today') | float(0) < 8 }}"

  action:
    # Variables for Mobile Push and Persistent summary
    - variables:
        remaining_today: >-
          {% set v = states('sensor.solar_forecast_remaining_today') %}
          {% if v in ['unknown','unavailable','None',''] %}N/A{% else %}{{ v | float(0) | round(2) }}{% endif %}
        total_today: >-
          {% set v = states('sensor.solar_forecast_total_today') %}
          {% if v in ['unknown','unavailable','None',''] %}N/A{% else %}{{ v | float(0) | round(2) }}{% endif %}
        peak_time: >-
          {% set raw = states('sensor.solar_forecast_peak_time_today') %}
          {% if raw in ['unknown','unavailable','None',''] %}
            N/A
          {% else %}
            {{ as_datetime(raw).strftime('%H:%M') }}
          {% endif %}
        action_rec: >-
          {% set v = states('sensor.solar_forecast_action_recommendation') %}
          {% if v in ['unknown','unavailable','None',''] %}No recommendation{% else %}{{ v }}{% endif %}
        recommended_slots: >-
          {% set v = states('sensor.solar_recommended_load_slots_today') %}
          {% if v in ['unknown','unavailable','None',''] %}Unavailable{% else %}{{ v }}{% endif %}

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "⚠️ Low Solar Day Alert (08:10) — {{ now().strftime('%d %b %Y') }}"
        message: >-
          Low solar day forecast detected at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

          ⚠️ Forecast Alert:
          • Quality: Low
          • Remaining Today: {{ remaining_today }} kWh (below 8 kWh threshold)
          • Total Today: {{ total_today }} kWh
          • Peak Time: {{ peak_time }}
          • Recommended Slots: {{ recommended_slots }}
          • Action: {{ action_rec }}

          💡 Recommendations:
          • Reduce non-essential loads during low production period
          • Avoid running high-consumption appliances today
          • Monitor grid import closely
          • Consider delaying heavy loads to tomorrow if forecast improves
        notification_id: "solar_forecast_low_alert"

    # --- Email ---
    - service: notify.email_ha
      data:
        title: "⚠️ Low Solar Day Alert"
        message: >-
          {% from 'solar_forecast_notifications.jinja' import solar_forecast_email_low_alert %}
          {{ solar_forecast_email_low_alert() }}

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_id_2
        message: >-
          {% from 'solar_forecast_notifications.jinja' import solar_forecast_telegram_low_alert %}
          {{ solar_forecast_telegram_low_alert() }}
        parse_mode: markdown

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "⚠️ Low Solar Day Alert — {{ now().strftime('%d %b %Y') }}"
        message: >-
          LOW solar day — only {{ remaining_today }} kWh remaining (Total {{ total_today }} kWh).
          Peak: {{ peak_time }} | Action: {{ action_rec }}
          Reduce non-essential loads today.
        data:
          channel: "Solar Forecast"
          importance: high
          group: "ha-solar-forecast"
          color: "#F44336"
          icon_url: "https://www.home-assistant.io/images/favicon-192x192-full.png"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Low Solar Day Alert sent at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
          Remaining: {{ remaining_today }} kWh (below 8 kWh threshold).
          Total: {{ total_today }} kWh, Peak: {{ peak_time }}, Action: {{ action_rec }}.
          Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent.
        level: warning

  mode: single
#===============================================================================
# END OF SOLAR FORECAST NOTIFICATIONS
#===============================================================================
