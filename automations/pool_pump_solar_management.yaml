#===============================================================================
# SOLAR: Pool Pump Management by PV Production (06:00–18:00)
# File: automations/pool_pump_solar_management.yaml
# Updated: 2026-05-01
# - Turn OFF if PV < 2500 W for 15 min
# - Turn ON  if PV > 3599 W for 15 min
# - Acts only between 06:00 and 18:00 local time
# - Guarded by Maintenance Mode (must be OFF)
# - Includes periodic re-evaluation every 5 minutes
# - Uses:
#     PV sensor: sensor.deyeinvertercombined_pv_power (W)
#     Pump switch: switch.pool_pump
# Channels: Email | Telegram | Mobile Push (SM-G996B) | Persistent | System Log
#===============================================================================

#----------------------------------------------------------------------------
# Turn OFF pool pump when PV is insufficient
#----------------------------------------------------------------------------
- id: pool_pump_off_on_low_pv
  alias: "Solar: Pool Pump OFF when PV < 2500 W (06:00–18:00)"
  description: >
    If PV production drops below 2500 W (sustained 15 minutes) during 06:00–18:00,
    turn the pool pump OFF (if it is running). Guarded by Maintenance Mode.
    Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent, System Log.

  trigger:
    # Primary trigger: PV falls and stays below threshold for 15 minutes
    - platform: numeric_state
      entity_id: sensor.deyeinvertercombined_pv_power
      below: 2500
      for:
        minutes: 15
    # Fallback: periodic check in case HA started below threshold and never crossed it
    - platform: time_pattern
      minutes: "/5"

  condition:
    - condition: state
      entity_id: input_boolean.maintenance_mode
      state: "off"
    - condition: time
      after: "06:00:00"
      before: "18:00:00"
    # Ensure pump is currently ON
    - condition: state
      entity_id: switch.pool_pump
      state: "on"
    # Ensure PV is indeed below threshold (covers the periodic trigger)
    - condition: template
      value_template: "{{ states('sensor.deyeinvertercombined_pv_power') | float(0) < 2500 }}"

  action:
    - variables:
        pv_now: "{{ states('sensor.deyeinvertercombined_pv_power') | float(0) | round(0) }}"
        threshold_off: 2500
        battery_soc: >-
          {% set soc = states('sensor.deyeinvertermaster_battery_soc') %}
          {% if soc in ['unknown','unavailable','None',''] %}N/A{% else %}{{ soc | float(0) | round(0) }}%{% endif %}
        load_power: >-
          {% set lp = states('sensor.deyeinvertercombined_load_power') %}
          {% if lp in ['unknown','unavailable','None',''] %}N/A{% else %}{{ lp | float(0) | round(0) }} W{% endif %}
        local_url: "http://192.168.1.31:8123/"
        cloud_url: "https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/"

    # Turn OFF the pool pump
    - service: switch.turn_off
      target:
        entity_id: switch.pool_pump

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "🛑 Pool Pump OFF — PV Low ({{ now().strftime('%d %b %Y %H:%M') }})"
        message: >-
          Pool pump turned OFF at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

          ☀️ Reason: PV stayed below {{ threshold_off }} W for 15 minutes.

          📊 Current System Status:
          • PV Power Now: {{ pv_now }} W (threshold: {{ threshold_off }} W)
          • Battery SOC: {{ battery_soc }}
          • Load Power: {{ load_power }}

          🔄 Pool pump will restart automatically when PV exceeds 3599 W
          sustained for 15 minutes between 06:00 and 18:00.

          🌐 Local: {{ local_url }}
          ☁️ Cloud: {{ cloud_url }}
        notification_id: "pool_pump_solar_manager"

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_id_2
        message: >-
          🛑 *Pool Pump OFF — PV Low*

          ☀️ PV: {{ pv_now }} W (below {{ threshold_off }} W for 15 min)
          🔋 Battery SOC: {{ battery_soc }}
          ⚡ Load: {{ load_power }}

          Pool pump will restart when PV > 3599 W for 15 min.
          _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_
          🌐 {{ local_url }}
        parse_mode: markdown

    # --- Email ---
    - service: notify.email_notification_jbarkhuizen_gmail_com
      data:
        title: "🛑 Pool Pump OFF — PV Low ({{ now().strftime('%Y-%m-%d %H:%M') }})"
        message: >-
          POOL PUMP TURNED OFF — PV INSUFFICIENT

          Date: {{ now().strftime('%A, %d %B %Y at %H:%M:%S') }}

          ================================================================================

          REASON: PV power stayed below {{ threshold_off }} W for 15 consecutive minutes.

          CURRENT SYSTEM STATUS:
          • PV Power Now: {{ pv_now }} W (threshold: {{ threshold_off }} W)
          • Battery SOC: {{ battery_soc }}
          • Load Power: {{ load_power }}

          WHAT HAPPENS NEXT:
          The pool pump will restart automatically when PV production exceeds
          3599 W for 15 consecutive minutes between 06:00 and 18:00.

          No manual action is required unless you wish to override.

          ================================================================================

          Managed by: Solar Pool Pump Automation
          System: {{ local_url }}
          Cloud: {{ cloud_url }}

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "🛑 Pool Pump OFF — PV Low"
        message: >-
          PV: {{ pv_now }} W (below {{ threshold_off }} W for 15 min).
          Battery SOC: {{ battery_soc }} | Load: {{ load_power }}.
          Pump restarts when PV > 3599 W for 15 min.
        data:
          channel: "Pool Pump"
          importance: default
          group: "ha-pool"
          color: "#FF5722"
          icon_url: "https://www.home-assistant.io/images/favicon-192x192-full.png"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Pool Pump OFF: PV {{ pv_now }} W (below {{ threshold_off }} W for 15 min)
          at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
          Battery SOC: {{ battery_soc }}, Load: {{ load_power }}.
          Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent.
        level: info

  mode: single

#----------------------------------------------------------------------------
# Turn ON pool pump when PV is sufficient
#----------------------------------------------------------------------------
- id: pool_pump_on_on_high_pv
  alias: "Solar: Pool Pump ON when PV > 3599 W (06:00–18:00)"
  description: >
    If PV production rises above 3599 W (sustained 15 minutes) during 06:00–18:00,
    turn the pool pump ON (if it is OFF). Guarded by Maintenance Mode.
    Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent, System Log.

  trigger:
    # Primary trigger: PV rises and stays above threshold for 15 minutes
    - platform: numeric_state
      entity_id: sensor.deyeinvertercombined_pv_power
      above: 3599
      for:
        minutes: 15
    # Fallback: periodic check
    - platform: time_pattern
      minutes: "/5"

  condition:
    - condition: state
      entity_id: input_boolean.maintenance_mode
      state: "off"
    - condition: time
      after: "06:00:00"
      before: "18:00:00"
    # Ensure pump is currently OFF
    - condition: state
      entity_id: switch.pool_pump
      state: "off"
    # Ensure PV is indeed above threshold (covers the periodic trigger)
    - condition: template
      value_template: "{{ states('sensor.deyeinvertercombined_pv_power') | float(0) > 3599 }}"

  action:
    - variables:
        pv_now: "{{ states('sensor.deyeinvertercombined_pv_power') | float(0) | round(0) }}"
        threshold_on: 3599
        battery_soc: >-
          {% set soc = states('sensor.deyeinvertermaster_battery_soc') %}
          {% if soc in ['unknown','unavailable','None',''] %}N/A{% else %}{{ soc | float(0) | round(0) }}%{% endif %}
        load_power: >-
          {% set lp = states('sensor.deyeinvertercombined_load_power') %}
          {% if lp in ['unknown','unavailable','None',''] %}N/A{% else %}{{ lp | float(0) | round(0) }} W{% endif %}
        local_url: "http://192.168.1.31:8123/"
        cloud_url: "https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/"

    # Turn ON the pool pump
    - service: switch.turn_on
      target:
        entity_id: switch.pool_pump

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "✅ Pool Pump ON — PV Sufficient ({{ now().strftime('%d %b %Y %H:%M') }})"
        message: >-
          Pool pump turned ON at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

          ☀️ Reason: PV stayed above {{ threshold_on }} W for 15 minutes.

          📊 Current System Status:
          • PV Power Now: {{ pv_now }} W (threshold: {{ threshold_on }} W)
          • Battery SOC: {{ battery_soc }}
          • Load Power: {{ load_power }}

          🔄 Pool pump will turn OFF automatically if PV drops below 2500 W
          sustained for 15 minutes.

          🌐 Local: {{ local_url }}
          ☁️ Cloud: {{ cloud_url }}
        notification_id: "pool_pump_solar_manager"

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_id_2
        message: >-
          ✅ *Pool Pump ON — PV Sufficient*

          ☀️ PV: {{ pv_now }} W (above {{ threshold_on }} W for 15 min)
          🔋 Battery SOC: {{ battery_soc }}
          ⚡ Load: {{ load_power }}

          Pool pump will stop if PV drops below 2500 W for 15 min.
          _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_
          🌐 {{ local_url }}
        parse_mode: markdown

    # --- Email ---
    - service: notify.email_notification_jbarkhuizen_gmail_com
      data:
        title: "✅ Pool Pump ON — PV Sufficient ({{ now().strftime('%Y-%m-%d %H:%M') }})"
        message: >-
          POOL PUMP TURNED ON — PV SUFFICIENT

          Date: {{ now().strftime('%A, %d %B %Y at %H:%M:%S') }}

          ================================================================================

          REASON: PV power stayed above {{ threshold_on }} W for 15 consecutive minutes.

          CURRENT SYSTEM STATUS:
          • PV Power Now: {{ pv_now }} W (threshold: {{ threshold_on }} W)
          • Battery SOC: {{ battery_soc }}
          • Load Power: {{ load_power }}

          WHAT HAPPENS NEXT:
          The pool pump will turn OFF automatically if PV production drops below
          2500 W for 15 consecutive minutes.

          No manual action is required unless you wish to override.

          ================================================================================

          Managed by: Solar Pool Pump Automation
          System: {{ local_url }}
          Cloud: {{ cloud_url }}

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "✅ Pool Pump ON — PV Sufficient"
        message: >-
          PV: {{ pv_now }} W (above {{ threshold_on }} W for 15 min).
          Battery SOC: {{ battery_soc }} | Load: {{ load_power }}.
          Pump stops if PV drops below 2500 W for 15 min.
        data:
          channel: "Pool Pump"
          importance: default
          group: "ha-pool"
          color: "#4CAF50"
          icon_url: "https://www.home-assistant.io/images/favicon-192x192-full.png"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Pool Pump ON: PV {{ pv_now }} W (above {{ threshold_on }} W for 15 min)
          at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
          Battery SOC: {{ battery_soc }}, Load: {{ load_power }}.
          Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent.
        level: info

  mode: single
#===============================================================================
# END OF SOLAR POOL PUMP MANAGEMENT
