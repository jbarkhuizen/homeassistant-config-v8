#===============================================================================
# DAILY UPDATE REPORT AUTOMATIONS
# File: automations/update_report_email.yaml
# Updated: 2026-05-01
# Channels: Email | Telegram | Mobile Push (SM-G996B) | Persistent | System Log
#===============================================================================

#-----------------------------------------------------------------------------
# 1) DAILY UPDATE REPORT - ALL CHANNELS (08:00)
#    Guarded by Maintenance Mode
#    Runs daily if updates available, or every Monday regardless
#-----------------------------------------------------------------------------
- id: daily_update_status_report_email
  alias: "System: Daily Update Status Report at 08:00 (All Channels)"
  description: "Send daily report of available updates via Email, Telegram, Mobile Push and Persistent at 08:00"

  trigger:
    - platform: time
      at: "08:00:00"

  condition:
    - condition: state
      entity_id: input_boolean.maintenance_mode
      state: "off"
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ state_attr('sensor.home_assistant_updates_summary', 'total_updates') | int(0) > 0 }}"
        - condition: time
          weekday:
            - mon

  action:
    - delay:
        seconds: 10

    # Variables for Mobile Push and Persistent
    - variables:
        total_updates: "{{ state_attr('sensor.home_assistant_updates_summary', 'total_updates') | int(0) }}"
        has_critical: "{{ state_attr('sensor.home_assistant_updates_summary', 'has_critical_updates') | default(false) | bool }}"
        friendly_summary: "{{ state_attr('sensor.home_assistant_updates_summary', 'friendly_summary') | default('No summary available') }}"
        updates_list: "{{ state_attr('sensor.home_assistant_updates_summary', 'updates_list') | default([]) }}"

    # --- Email ---
    - service: notify.email_notification_jbarkhuizen_gmail_com
      data:
        title: "📊 Daily Home Assistant Update Report - {{ now().strftime('%Y-%m-%d') }}"
        message: >-
          HOME ASSISTANT UPDATE REPORT

          Generated: {{ now().strftime('%A, %d %B %Y at %H:%M:%S') }}

          ================================================================================

          SUMMARY

          --------

          {{ state_attr('sensor.home_assistant_updates_summary', 'friendly_summary') | default('Checking updates...') }}

          Total Updates Available: {{ state_attr('sensor.home_assistant_updates_summary', 'total_updates') | default(0) }}

          {% if state_attr('sensor.home_assistant_updates_summary', 'total_updates') | int(0) > 0 %}

          AVAILABLE UPDATES

          -----------------

          {% for update in state_attr('sensor.home_assistant_updates_summary', 'updates_list') | default([]) %}

          {{ loop.index }}. {{ update }}

          {% endfor %}

          DETAILED STATUS

          ---------------

          {% set detailed = state_attr('sensor.home_assistant_updates_summary', 'detailed_status') | default({}) %}

          {% for component, details in detailed.items() %}

          {% if details.update_available %}

          {{ component }}:

            Status: UPDATE AVAILABLE

            Current Version: {{ details.current_version }}

            Latest Version: {{ details.latest_version }}

            {% if 'entity_id' in details %}Entity: {{ details.entity_id }}{% endif %}

          {% endif %}

          {% endfor %}

          {% if state_attr('sensor.home_assistant_updates_summary', 'has_critical_updates') %}

          ⚠️ CRITICAL UPDATES AVAILABLE ⚠️

          ---------------------------------

          Critical system components need updating. Please update as soon as possible:

          {% endif %}

          {% endif %}

          🕐 Checked: {{ state_attr('sensor.home_assistant_updates_summary', 'last_checked') | default(now().strftime('%Y-%m-%d %H:%M:%S')) }}
          🌐 IP: 192.168.1.31:8123
          📅 {{ now().strftime('%A, %d %B %Y at %H:%M') }}

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_id_2
        message: >-
          {% if total_updates > 0 %}
          {% if has_critical %}🚨{% else %}📊{% endif %} *Daily Update Report — {{ now().strftime('%d %b %Y') }}*

          {% if has_critical %}⚠️ *CRITICAL UPDATES AVAILABLE* ⚠️{% endif %}

          📦 Total Updates: {{ total_updates }}

          *Available Updates:*
          {% for u in updates_list %}• {{ u }}
          {% endfor %}

          🕐 Checked: {{ now().strftime('%H:%M:%S') }}
          🌐 192.168.1.31:8123
          {% else %}
          📊 *Daily Update Report — {{ now().strftime('%d %b %Y') }}*

          ✅ No updates available. All components are up to date.

          🕐 Checked: {{ now().strftime('%H:%M:%S') }}
          🌐 192.168.1.31:8123
          {% endif %}
        parse_mode: markdown

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: >-
          {% if has_critical %}🚨 CRITICAL Updates Available!
          {% elif total_updates > 0 %}📦 {{ total_updates }} Update(s) Available
          {% else %}✅ HA Updates — All Up To Date
          {% endif %}
        message: >-
          {% if total_updates > 0 %}
          {{ total_updates }} update(s) pending.
          {% if has_critical %}⚠️ CRITICAL updates require immediate attention!{% endif %}
          {{ friendly_summary }}
          {% else %}
          All components are up to date as of {{ now().strftime('%H:%M') }}.
          {% endif %}
        data:
          channel: "System Updates"
          importance: >-
            {% if has_critical %}high{% elif total_updates > 0 %}default{% else %}min{% endif %}
          group: "ha-updates"
          color: >-
            {% if has_critical %}#B71C1C{% elif total_updates > 0 %}#FF9800{% else %}#4CAF50{% endif %}
          icon_url: "https://www.home-assistant.io/images/favicon-192x192-full.png"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: >-
          {% if has_critical %}🚨 CRITICAL Updates Available — {{ now().strftime('%d %b %Y') }}
          {% elif total_updates > 0 %}📦 {{ total_updates }} Update(s) Available — {{ now().strftime('%d %b %Y') }}
          {% else %}✅ Daily Update Report — {{ now().strftime('%d %b %Y') }}
          {% endif %}
        message: >-
          Daily update report at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

          {% if total_updates > 0 %}
          📦 Total Updates: {{ total_updates }}
          {% if has_critical %}⚠️ CRITICAL updates available — action required immediately!{% endif %}

          Available Updates:
          {% for u in updates_list %}• {{ u }}
          {% endfor %}
          {% else %}
          ✅ No updates available. All components are up to date.
          {% endif %}

          🕐 Checked: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}

          ✅ Email sent — notify.email_notification_jbarkhuizen_gmail_com
          ✅ Telegram sent — chat_id_2
          ✅ Mobile Push sent — SM-G996B
        notification_id: "daily_update_report"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Daily update report sent at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
          Total updates: {{ total_updates }}, Critical: {{ has_critical }}.
          Summary: {{ friendly_summary }}.
          Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent.
        level: info

  mode: single

#-----------------------------------------------------------------------------
# 2) DAILY AUTOMATIC UPDATES + SUCCESS / FAILURE NOTIFICATIONS (08:15)
#    Hardened with status sensor event firing & failure notices
#-----------------------------------------------------------------------------
- id: daily_automatic_updates_and_notifications_0815
  alias: "System: Daily Automatic Updates and Notifications at 08:15"
  description: >
    Automatically install available updates and report success or failure via
    Email, Telegram, Mobile Push, Persistent Notification and System Log.
    Fires event 'auto_update_cycle_complete' for status sensor.

  trigger:
    - platform: time
      at: "08:15:00"

  condition:
    - condition: state
      entity_id: input_boolean.maintenance_mode
      state: "off"
    - condition: template
      value_template: "{{ state_attr('sensor.home_assistant_updates_summary', 'total_updates') | int(0) > 0 }}"

  action:
    # (A1) Snapshot pre-update
    - variables:
        cycle_start: "{{ now() }}"
        pre_count: "{{ state_attr('sensor.home_assistant_updates_summary', 'total_updates') | int(0) }}"
        core_on: "{{ is_state('update.home_assistant_core_update','on') }}"
        os_on: "{{ is_state('update.home_assistant_operating_system_update','on') }}"
        supervisor_on: "{{ is_state('update.home_assistant_supervisor_update','on') }}"
        attempted_entities: >
          {% set ignore = [] %}
          {% set base = states.update
             | selectattr('state','eq','on')
             | map(attribute='entity_id')
             | list %}
          {{ base }}

    - delay:
        seconds: 30

    # (A2) Install core components individually
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ core_on | bool }}"
          sequence:
            - service: update.install
              target:
                entity_id: update.home_assistant_core_update
              data:
                backup: true
        - conditions:
            - condition: template
              value_template: "{{ os_on | bool }}"
          sequence:
            - service: update.install
              target:
                entity_id: update.home_assistant_operating_system_update
              data:
                backup: true
        - conditions:
            - condition: template
              value_template: "{{ supervisor_on | bool }}"
          sequence:
            - service: update.install
              target:
                entity_id: update.home_assistant_supervisor_update
              data:
                backup: true

    # (A3) Install all other add-on/integration updates
    - service: update.install
      data:
        backup: true
      target:
        entity_id: >
          {% set ignore = [
            'update.home_assistant_core_update',
            'update.home_assistant_operating_system_update',
            'update.home_assistant_supervisor_update'
          ] %}
          {% set others = states.update
              | selectattr('state','eq','on')
              | rejectattr('entity_id','in',ignore)
              | map(attribute='entity_id')
              | list %}
          {{ others }}

    # (A4) Wait for installations to start
    - delay:
        minutes: 3

    # (A5) Post-update snapshot
    - variables:
        post_count: "{{ state_attr('sensor.home_assistant_updates_summary', 'total_updates') | int(0) }}"
        remaining_entities: >
          {% set still = states.update
              | selectattr('state','eq','on')
              | map(attribute='entity_id')
              | list %}
          {{ still }}
        restart_required: "{{ core_on or os_on or supervisor_on }}"
        duration_seconds: "{{ (as_timestamp(now()) - as_timestamp(cycle_start)) | int }}"

    # (A6) Determine status & detail
    - variables:
        status: >
          {% if pre_count == 0 %}
            no_updates
          {% elif post_count < pre_count %}
            success
          {% elif post_count == pre_count and pre_count > 0 and (remaining_entities | length) > 0 %}
            partial
          {% elif post_count == pre_count and pre_count > 0 and (remaining_entities | length) == 0 %}
            success
          {% else %}
            failure
          {% endif %}
        status_detail: >
          {% if status == 'success' %}
            Updates decreased from {{ pre_count }} to {{ post_count }}.
          {% elif status == 'partial' %}
            Some updates remain: {{ remaining_entities }}.
          {% elif status == 'failure' %}
            No reduction in update count ({{ pre_count }} -> {{ post_count }}).
          {% elif status == 'no_updates' %}
            No updates were pending.
          {% else %}
            Undefined status condition.
          {% endif %}

    # (A7) Conditional notifications based on status
    - choose:

        #-------------------------------------------------------------------
        # FAILURE PATH
        #-------------------------------------------------------------------
        - conditions:
            - condition: template
              value_template: "{{ status == 'failure' }}"
          sequence:
            # --- Persistent Notification ---
            - service: persistent_notification.create
              data:
                title: "❌ Auto Update FAILED — {{ now().strftime('%d %b %Y %H:%M') }}"
                message: >-
                  Automatic update routine FAILED at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

                  ❌ Status: FAILURE
                  📦 Pre-count: {{ pre_count }} → Post-count: {{ post_count }}
                  🔁 No reduction in update count.

                  Remaining Entities:
                  {% for r in remaining_entities %}• {{ r }}
                  {% endfor %}
                  {% if remaining_entities | length == 0 %}• None{% endif %}

                  ⚠️ Please check the update log and manually review failed updates.
                  🌐 192.168.1.31:8123
                notification_id: "auto_update_failure"

            # --- Telegram ---
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_id_2
                message: >-
                  ❌ *Auto Update Failure*
                  Pre: {{ pre_count }} | Post: {{ post_count }}
                  Remaining: {{ remaining_entities | join(', ') if remaining_entities else 'None' }}
                  _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_
                parse_mode: markdown

            # --- Mobile Push ---
            - service: notify.mobile_app_sm_g996b
              data:
                title: "❌ Auto Update FAILED"
                message: "Update failed: {{ pre_count }} → {{ post_count }} updates. {{ remaining_entities | length }} still pending. Check HA logs."
                data:
                  channel: "System Updates"
                  importance: high
                  group: "ha-updates"
                  color: "#B71C1C"
                  actions:
                    - action: "OPEN_HA"
                      title: "Open HA"
                      uri: "http://192.168.1.31:8123"

            # --- Email ---
            - service: notify.email_notification_jbarkhuizen_gmail_com
              data:
                title: "❌ Auto Update FAILED — {{ now().strftime('%Y-%m-%d %H:%M') }}"
                message: >-
                  AUTO UPDATE FAILED

                  Automatic update routine failed at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

                  Status: FAILURE
                  Pre-count: {{ pre_count }}
                  Post-count: {{ post_count }}
                  Remaining Entities:
                  {% for r in remaining_entities %}
                  - {{ r }}
                  {% endfor %}
                  {% if remaining_entities | length == 0 %}None{% endif %}

                  Please review the failed updates in Home Assistant.

                  IP: 192.168.1.31:8123
                  Cloud: https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/

        #-------------------------------------------------------------------
        # PARTIAL PATH
        #-------------------------------------------------------------------
        - conditions:
            - condition: template
              value_template: "{{ status == 'partial' }}"
          sequence:
            # --- Persistent Notification ---
            - service: persistent_notification.create
              data:
                title: "⚠️ Auto Update PARTIAL — {{ now().strftime('%d %b %Y %H:%M') }}"
                message: >-
                  Automatic update routine partially completed at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

                  ⚠️ Status: PARTIAL
                  📦 Pre-count: {{ pre_count }} → Post-count: {{ post_count }}
                  🔁 Some updates remain.

                  Remaining Entities:
                  {% for r in remaining_entities %}• {{ r }}
                  {% endfor %}
                  {% if remaining_entities | length == 0 %}• None{% endif %}

                  ℹ️ These may require manual update or a restart.
                  🌐 192.168.1.31:8123
                notification_id: "auto_update_partial"

            # --- Telegram ---
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_id_2
                message: >-
                  ⚠️ *Auto Update Partial*
                  Pre: {{ pre_count }} | Post: {{ post_count }}
                  Remaining: {{ remaining_entities | join(', ') if remaining_entities else 'None' }}
                  _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_
                parse_mode: markdown

            # --- Mobile Push ---
            - service: notify.mobile_app_sm_g996b
              data:
                title: "⚠️ Auto Update PARTIAL"
                message: "Partial update: {{ pre_count }} → {{ post_count }}. {{ remaining_entities | length }} update(s) still pending. May need manual action."
                data:
                  channel: "System Updates"
                  importance: high
                  group: "ha-updates"
                  color: "#FF9800"
                  actions:
                    - action: "OPEN_HA"
                      title: "Open HA"
                      uri: "http://192.168.1.31:8123"

            # --- Email ---
            - service: notify.email_notification_jbarkhuizen_gmail_com
              data:
                title: "⚠️ Auto Update PARTIAL — {{ now().strftime('%Y-%m-%d %H:%M') }}"
                message: >-
                  AUTO UPDATE PARTIAL

                  Automatic update routine partially completed at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

                  Status: PARTIAL
                  Pre-count: {{ pre_count }}
                  Post-count: {{ post_count }}
                  Remaining Entities:
                  {% for r in remaining_entities %}
                  - {{ r }}
                  {% endfor %}
                  {% if remaining_entities | length == 0 %}None{% endif %}

                  These updates may require manual intervention or a restart.

                  IP: 192.168.1.31:8123
                  Cloud: https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/

        #-------------------------------------------------------------------
        # SUCCESS PATH
        #-------------------------------------------------------------------
        - conditions:
            - condition: template
              value_template: "{{ status == 'success' }}"
          sequence:
            # --- Persistent Notification ---
            - service: persistent_notification.create
              data:
                title: "✅ Auto Update SUCCESS — {{ now().strftime('%d %b %Y %H:%M') }}"
                message: >-
                  Automatic updates completed successfully at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

                  ✅ Status: SUCCESS
                  📦 Pre-count: {{ pre_count }} → Post-count: {{ post_count }}
                  ⏱️ Duration: {{ duration_seconds }} seconds
                  🔄 Restart Required: {{ restart_required }}

                  {% if restart_required %}
                  ⚠️ A restart is required to complete the Core/OS/Supervisor update.
                  Please restart Home Assistant at a convenient time.
                  {% endif %}
                  🌐 192.168.1.31:8123
                notification_id: "auto_update_success"

            # --- Telegram ---
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_id_2
                message: >-
                  ✅ *Auto Update Success*
                  Pre: {{ pre_count }} | Post: {{ post_count }}
                  Remaining: {{ remaining_entities | length }}
                  Restart Required: {{ restart_required }}
                  _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_
                parse_mode: markdown

            # --- Mobile Push ---
            - service: notify.mobile_app_sm_g996b
              data:
                title: "✅ Auto Update SUCCESS"
                message: >-
                  {{ pre_count }} → {{ post_count }} updates. Duration: {{ duration_seconds }}s.
                  {% if restart_required %}⚠️ Restart required to complete Core/OS update.{% else %}No restart needed.{% endif %}
                data:
                  channel: "System Updates"
                  importance: >-
                    {% if restart_required %}high{% else %}default{% endif %}
                  group: "ha-updates"
                  color: >-
                    {% if restart_required %}#FF9800{% else %}#4CAF50{% endif %}
                  actions:
                    - action: "OPEN_HA"
                      title: "Open HA"
                      uri: "http://192.168.1.31:8123"

            # --- Email ---
            - service: notify.email_notification_jbarkhuizen_gmail_com
              data:
                title: "✅ Auto Update SUCCESS — {{ now().strftime('%Y-%m-%d %H:%M') }}"
                message: >-
                  AUTO UPDATE SUCCESS

                  Automatic updates completed successfully at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

                  Status: SUCCESS
                  Pre-count: {{ pre_count }}
                  Post-count: {{ post_count }}
                  Duration: {{ duration_seconds }} seconds
                  Restart Required: {{ restart_required }}

                  {% if restart_required %}
                  A restart is required to complete the Core, OS or Supervisor update.
                  {% endif %}

                  IP: 192.168.1.31:8123
                  Cloud: https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/

        #-------------------------------------------------------------------
        # NO UPDATES PATH
        #-------------------------------------------------------------------
        - conditions:
            - condition: template
              value_template: "{{ status == 'no_updates' }}"
          sequence:
            # --- Telegram ---
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_id_2
                message: >-
                  ✅ *Auto Update: No Updates Pending*
                  All components are up to date.
                  _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_
                parse_mode: markdown

            # --- Mobile Push ---
            - service: notify.mobile_app_sm_g996b
              data:
                title: "✅ No Updates Pending"
                message: "All HA components are up to date as of {{ now().strftime('%H:%M') }}. No action required."
                data:
                  channel: "System Updates"
                  importance: min
                  group: "ha-updates"
                  color: "#4CAF50"

            # --- Persistent Notification ---
            - service: persistent_notification.create
              data:
                title: "✅ Auto Update — No Updates Pending"
                message: >-
                  Auto update cycle ran at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
                  All components are up to date. No action required.
                notification_id: "auto_update_no_updates"

            # --- Email ---
            - service: notify.email_notification_jbarkhuizen_gmail_com
              data:
                title: "✅ Auto Update — No Updates Pending ({{ now().strftime('%Y-%m-%d') }})"
                message: >-
                  AUTO UPDATE STATUS

                  No updates were pending at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
                  All components are up to date. No action required.

                  IP: 192.168.1.31:8123
                  Cloud: https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/

            # --- System Log ---
            - service: system_log.write
              data:
                message: "Auto Update: No updates were pending at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}."
                level: info

    # (A8) Fire event for trigger-based status sensor
    - service: event.fire
      data:
        event_type: auto_update_cycle_complete
        event_data:
          last_run: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          pre_count: "{{ pre_count }}"
          post_count: "{{ post_count }}"
          attempted_entities: "{{ attempted_entities }}"
          remaining_entities: "{{ remaining_entities }}"
          duration_seconds: "{{ duration_seconds }}"
          restart_required: "{{ restart_required }}"
          status: "{{ status }}"
          status_detail: "{{ status_detail }}"

    # (A9) Log outcome
    - service: system_log.write
      data:
        message: >
          Auto Update Cycle finished: status={{ status }}, pre={{ pre_count }}, post={{ post_count }},
          remaining={{ remaining_entities }}, restart_required={{ restart_required }},
          duration={{ duration_seconds }}s. Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent.
        level: info

    # (A10) Email summary (always sent)
    - service: notify.email_notification_jbarkhuizen_gmail_com
      data:
        title: "🔄 Auto Update Result — {{ status | capitalize }} ({{ now().strftime('%Y-%m-%d') }})"
        message: >-
          AUTO UPDATE RESULT

          Status: {{ status | upper }}
          Detail: {{ status_detail }}

          Start: {{ cycle_start.strftime('%Y-%m-%d %H:%M:%S') }}
          End: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
          Duration: {{ duration_seconds }} seconds

          Pre-count: {{ pre_count }}
          Post-count: {{ post_count }}
          Attempted Entities:
          {% for e in attempted_entities %}
            - {{ e }}
          {% endfor %}

          Remaining After Attempt:
          {% for r in remaining_entities %}
            - {{ r }}
          {% endfor %}
          {% if remaining_entities | length == 0 %}None{% endif %}

          Restart Required: {{ restart_required }}

          IP: 192.168.1.31:8123
          Cloud: https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/

  mode: single
#===============================================================================
# END OF DAILY UPDATE REPORT AUTOMATIONS
#===============================================================================