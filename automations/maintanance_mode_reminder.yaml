#===============================================================================
# SYSTEM: Maintenance Mode Reminder (08:50)
# File: automations/maintanance_mode_reminder.yaml
# Updated: 2026-05-01
# - Reminds you if Maintenance Mode is still ON near the end of the morning window.
# - Trigger inside 06:00–09:00 window.
# Channels: Email | Telegram | Mobile Push (SM-G996B) | Persistent | System Log
#===============================================================================
- id: maintenance_mode_reminder_0850
  alias: "System: Maintenance Mode Reminder 08:50 (All Channels)"
  description: >
    At 08:50, if Maintenance Mode is still ON, send a reminder via Email,
    Telegram, Mobile Push, Persistent Notification and System Log,
    including how long it has been active.

  trigger:
    - platform: time
      at: "08:50:00"

  condition:
    - condition: state
      entity_id: input_boolean.maintenance_mode
      state: "on"

  action:
    # Compute duration Maintenance Mode has been ON
    - variables:
        seconds_on: "{{ (as_timestamp(now()) - as_timestamp(states.input_boolean.maintenance_mode.last_changed)) | int(0) }}"
        hours_on: "{{ (seconds_on // 3600) | int }}"
        minutes_on: "{{ ((seconds_on % 3600) // 60) | int }}"
        duration_hm: >-
          {% if hours_on > 0 %}
            {{ hours_on }}h {{ minutes_on }}m
          {% else %}
            {{ minutes_on }}m
          {% endif %}
        cloud_url: "https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/"
        local_url: "http://192.168.1.31:8123/"

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "⚠️ Maintenance Mode Still ON (08:50 — {{ now().strftime('%d %b %Y') }})"
        message: >-
          Maintenance Mode reminder at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

          ⚠️ Maintenance Mode has been ON for: {{ duration_hm }}

          ❌ The following automations are currently suppressed:
          • Morning system overview
          • Solar daily & weekly reports
          • Solar forecast notifications
          • Battery weekly summary
          • MQTT broker alerts
          • Git snapshot (08:55)
          • All automations guarded by Maintenance Mode

          🔧 To turn OFF Maintenance Mode:
          Settings → Devices & Services → Helpers → input_boolean.maintenance_mode → Toggle OFF

          🌐 Local: {{ local_url }}
          ☁️ Cloud: {{ cloud_url }}
        notification_id: "maintenance_mode_reminder"

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        target:
          - !secret telegram_chat_id_2
        message: >-
          ⚠️ *Maintenance Mode Still ON (08:50)*

          Active for: *{{ duration_hm }}*

          Many scheduled automations are currently suppressed.
          Please turn OFF Maintenance Mode from HA if maintenance is complete.

          🔧 Settings → Helpers → input_boolean.maintenance_mode → Toggle OFF
          🌐 {{ local_url }}
          _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_
        parse_mode: markdown

    # --- Email ---
    - service: notify.email_notification_jbarkhuizen_gmail_com
      data:
        title: "⚠️ Maintenance Mode Still ON — {{ duration_hm }} ({{ now().strftime('%Y-%m-%d') }})"
        message: >-
          MAINTENANCE MODE REMINDER

          Date: {{ now().strftime('%A, %d %B %Y at %H:%M:%S') }}

          ================================================================================

          WARNING: Maintenance Mode has been ON for {{ duration_hm }}.

          AUTOMATIONS CURRENTLY SUPPRESSED:
          - Morning system overview (08:05)
          - Solar daily & weekly reports
          - Solar forecast notifications
          - Battery weekly summary (08:32)
          - MQTT broker alerts
          - Git snapshot (08:55)
          - All automations guarded by Maintenance Mode

          HOW TO TURN OFF MAINTENANCE MODE:
          1. Open Home Assistant: http://192.168.1.31:8123
          2. Go to Settings → Devices & Services → Helpers
          3. Find input_boolean.maintenance_mode
          4. Click to toggle it OFF

          ================================================================================

          System: {{ local_url }}
          Cloud: {{ cloud_url }}

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "⚠️ Maintenance Mode Still ON ({{ duration_hm }})"
        message: >-
          Maintenance Mode has been active for {{ duration_hm }}.
          Multiple scheduled automations are suppressed.
          Toggle OFF in HA Settings → Helpers if maintenance is complete.
        data:
          channel: "System Status"
          importance: high
          group: "ha-maintenance"
          color: "#FF9800"
          icon_url: "https://www.home-assistant.io/images/favicon-192x192-full.png"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Maintenance Mode reminder sent at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
          (ON for {{ duration_hm }}).
          Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent.
        level: warning

  mode: single
#===============================================================================
# END OF MAINTENANCE MODE REMINDER
#===============================================================================