- id: "1717083464657"
  alias: Server Sync Clock
  description: ""
  triggers:
    - trigger: time
      at: 00:50:00
      id: enableSync
    - trigger: time
      at: 01:10:00
      id: disableSync
  condition: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - enableSync
          sequence:
            - action: select.select_option
              target:
                entity_id: select.deyeinvertermaster_inverter_basic_settings_sync_clock
              data:
                option: Enable
        - conditions:
            - condition: trigger
              id:
                - disableSync
          sequence:
            - action: select.select_option
              metadata: {}
              data:
                option: Disable
              target:
                entity_id: select.deyeinvertermaster_inverter_basic_settings_sync_clock
  mode: single