#===============================================================================
# SECURITY: Bad Login Baseline + Daily Spike Check
# File: automations/security_anomaly_detection.yaml
# Updated: 2026-05-01
# Channels: Email | Telegram | Mobile Push (SM-G996B) | Persistent | System Log
#===============================================================================

#-----------------------------------------------------------------------------
# 1) Initialize Baseline (06:10)
#    - Sets the baseline to today's current count if:
#      a) baseline = 0 (first run) OR
#      b) baseline > current (log rotated)
#-----------------------------------------------------------------------------
- id: security_badlogin_initialize_baseline_0610
  alias: "Security - Badlogin Initialize Baseline (06:10)"
  description: >
    Initialize baseline to current badlogin count when missing or when the log
    rotated and the count decreased. Keeps daily comparison stable.
    Channels: Persistent, Mobile Push (informational), System Log.

  trigger:
    - platform: time
      at: "06:10:00"

  action:
    - variables:
        current: "{{ states('sensor.badlogin') | int(0) }}"
        baseline: "{{ states('input_number.badlogin_previous_count') | int(0) }}"
        reset_reason: >-
          {% if baseline == 0 %}First run — baseline not yet set
          {% elif baseline > current %}Log rotated — baseline reset from {{ baseline }} to {{ current }}
          {% else %}No reset required
          {% endif %}

    - choose:
        # Baseline needs initialising or resetting
        - conditions:
            - condition: template
              value_template: "{{ baseline == 0 or baseline > current }}"
          sequence:
            # Set new baseline
            - service: input_number.set_value
              target:
                entity_id: input_number.badlogin_previous_count
              data:
                value: "{{ current }}"

            # --- Mobile Push ---
            - service: notify.mobile_app_sm_g996b
              data:
                title: "🔐 Security Baseline Initialised (06:10)"
                message: "Bad login baseline set to {{ current }}. Reason: {{ reset_reason }}. Daily spike check runs at 09:00."
                data:
                  channel: "Security"
                  importance: min
                  group: "ha-security"
                  color: "#607D8B"

            # --- Persistent Notification ---
            - service: persistent_notification.create
              data:
                title: "🔐 Security Baseline Initialised (06:10)"
                message: >-
                  Bad login baseline initialised at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

                  🔢 New Baseline: {{ current }}
                  📋 Reason: {{ reset_reason }}
                  🔔 Daily spike check threshold: 25 bad logins
                  ⏰ Spike check runs at: 09:00 daily
                notification_id: "security_baseline_init"

            # --- System Log ---
            - service: system_log.write
              data:
                message: "Badlogin baseline initialised/reset to {{ current }} at 06:10. Reason: {{ reset_reason }}."
                level: info

  mode: single

#-----------------------------------------------------------------------------
# 2) Daily Spike Check (09:00)
#    - Compares current vs yesterday's baseline.
#    - If delta >= threshold, notify via all channels.
#    - Rolls the baseline forward to current after check.
#-----------------------------------------------------------------------------
- id: security_badlogin_daily_09h00_check
  alias: "Security - Badlogin Daily 09h00 Check"
  description: >
    Detects daily bad-login spikes vs yesterday's baseline; alerts when over threshold.
    Rolls the baseline after the check for a clean daily window.
    Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent, System Log.

  trigger:
    - platform: time
      at: "09:00:00"

  action:
    - variables:
        threshold: 25
        current: "{{ states('sensor.badlogin') | int(0) }}"
        baseline: "{{ states('input_number.badlogin_previous_count') | int(0) }}"
        diff: "{{ (current - baseline) | int }}"
        detail: >-
          Baseline: {{ baseline }} | Current: {{ current }} | Increase: {{ diff }} | Threshold: {{ threshold }}
        risk_level: >-
          {% if diff >= threshold * 3 %}CRITICAL
          {% elif diff >= threshold * 2 %}HIGH
          {% elif diff >= threshold %}ELEVATED
          {% else %}NORMAL
          {% endif %}
        risk_color: >-
          {% if diff >= threshold * 3 %}#B71C1C
          {% elif diff >= threshold * 2 %}#F44336
          {% elif diff >= threshold %}#FF9800
          {% else %}#4CAF50
          {% endif %}

    - choose:
        #-------------------------------------------------------------------
        # SPIKE DETECTED — diff >= threshold
        #-------------------------------------------------------------------
        - conditions:
            - condition: template
              value_template: "{{ diff >= threshold }}"
          sequence:
            # --- Persistent Notification ---
            - service: persistent_notification.create
              data:
                title: "🚨 Security: Bad Logins Spike — {{ risk_level }} (09:00 {{ now().strftime('%d %b %Y') }})"
                message: >-
                  Bad login spike detected at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

                  🔐 Security Alert Details:
                  • Risk Level: {{ risk_level }}
                  • Baseline (yesterday): {{ baseline }}
                  • Current Count: {{ current }}
                  • Increase: {{ diff }} (threshold: {{ threshold }})

                  ⚠️ Recommended Actions:
                  • Check Settings → Security → IP Ban log
                  • Review /config/home-assistant.log for failed login sources
                  • Consider enabling brute-force protection in HA settings
                  • If source is external, review firewall and Nabu Casa access rules
                  • Check if any device has incorrect credentials configured

                  🌐 192.168.1.31:8123
                notification_id: "security_badlogins_spike"

            # --- Telegram ---
            - service: telegram_bot.send_message
              data:
                target:
                  - !secret telegram_chat_id_2
                message: >-
                  🚨 *Security: Bad Logins Spike — {{ risk_level }}*

                  🔐 Baseline: {{ baseline }} | Current: {{ current }}
                  📈 Increase: {{ diff }} (threshold: {{ threshold }})
                  ⚠️ Risk Level: *{{ risk_level }}*

                  Check HA Security logs immediately.
                  _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_
                  🌐 192.168.1.31:8123
                parse_mode: markdown

            # --- Email ---
            - service: notify.email_notification_jbarkhuizen_gmail_com
              data:
                title: "🚨 Security: Bad Logins Spike — {{ risk_level }} ({{ now().strftime('%Y-%m-%d') }})"
                message: >-
                  SECURITY ALERT — BAD LOGINS SPIKE DETECTED

                  Date: {{ now().strftime('%A, %d %B %Y at %H:%M:%S') }}

                  ================================================================================

                  ALERT DETAILS

                  Risk Level: {{ risk_level }}
                  {{ detail }}

                  RECOMMENDED ACTIONS:
                  1. Check Settings → Security → IP Ban log in Home Assistant
                  2. Review /config/home-assistant.log for failed login sources and IP addresses
                  3. Enable brute-force protection if not already active
                  4. If source is external, review firewall and Nabu Casa access rules
                  5. Check all connected devices for incorrect credentials
                  6. Consider enabling 2-factor authentication on your HA account

                  ================================================================================

                  System: http://192.168.1.31:8123
                  Cloud: https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/

            # --- Mobile Push ---
            - service: notify.mobile_app_sm_g996b
              data:
                title: "🚨 Security Alert — Bad Logins Spike ({{ risk_level }})"
                message: >-
                  {{ diff }} new bad logins detected (baseline: {{ baseline }}, current: {{ current }}).
                  Risk: {{ risk_level }}. Check HA Security logs immediately.
                data:
                  channel: "Security"
                  importance: high
                  group: "ha-security"
                  color: "{{ risk_color }}"
                  actions:
                    - action: "OPEN_HA"
                      title: "Open HA Security"
                      uri: "http://192.168.1.31:8123/config/auth"

            # --- System Log ---
            - service: system_log.write
              data:
                message: >-
                  Security BAD LOGIN SPIKE: {{ diff }} new logins (baseline: {{ baseline }}, current: {{ current }},
                  threshold: {{ threshold }}, risk: {{ risk_level }}).
                  Channels: Email, Telegram, Mobile Push (SM-G996B), Persistent.
                level: warning

        #-------------------------------------------------------------------
        # NO SPIKE — diff < threshold (all clear)
        #-------------------------------------------------------------------
        - conditions:
            - condition: template
              value_template: "{{ diff < threshold }}"
          sequence:
            # --- Persistent Notification ---
            - service: persistent_notification.create
              data:
                title: "✅ Security: Bad Logins OK (09:00 {{ now().strftime('%d %b %Y') }})"
                message: >-
                  Daily bad login check completed at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

                  ✅ No spike detected — security status is normal.

                  🔐 Check Details:
                  • Baseline (yesterday): {{ baseline }}
                  • Current Count: {{ current }}
                  • Increase: {{ diff }} (threshold: {{ threshold }})
                  • Risk Level: NORMAL
                notification_id: "security_badlogins_ok"

            # --- Telegram ---
            - service: telegram_bot.send_message
              data:
                target:
                  - !secret telegram_chat_id_2
                message: >-
                  ✅ *Security: Bad Logins OK (09:00)*

                  No spike detected today.
                  Baseline: {{ baseline }} | Current: {{ current }} | Increase: {{ diff }}
                  Threshold: {{ threshold }} | Status: NORMAL

                  _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_
                parse_mode: markdown

            # --- Email ---
            - service: notify.email_notification_jbarkhuizen_gmail_com
              data:
                title: "✅ Security: Bad Logins OK — {{ now().strftime('%Y-%m-%d') }}"
                message: >-
                  SECURITY DAILY CHECK — NO SPIKE DETECTED

                  Date: {{ now().strftime('%A, %d %B %Y at %H:%M:%S') }}

                  ================================================================================

                  DAILY BAD LOGIN CHECK: NORMAL

                  Baseline (yesterday): {{ baseline }}
                  Current Count: {{ current }}
                  Increase: {{ diff }}
                  Threshold: {{ threshold }}
                  Risk Level: NORMAL

                  No action required. System security is operating normally.

                  ================================================================================

                  System: http://192.168.1.31:8123

            # --- Mobile Push ---
            - service: notify.mobile_app_sm_g996b
              data:
                title: "✅ Security Check OK (09:00)"
                message: "Bad logins: baseline {{ baseline }}, current {{ current }}, increase {{ diff }}. Below threshold of {{ threshold }}. All clear."
                data:
                  channel: "Security"
                  importance: min
                  group: "ha-security"
                  color: "#4CAF50"

            # --- System Log ---
            - service: system_log.write
              data:
                message: "Badlogins OK at 09:00 — {{ detail }}"
                level: info

    # Roll baseline forward for the next 24h window
    - service: input_number.set_value
      target:
        entity_id: input_number.badlogin_previous_count
      data:
        value: "{{ current }}"

  mode: single
#===============================================================================
# END OF SECURITY ANOMALY DETECTION
#===============================================================================