#===============================================================================
# Morning Test Email - Verifies System is Running
# File: automations/system_up_email.yaml
# Updated: 2026-05-01
# Channels: Email | Telegram | Mobile Push (SM-G996B) | Persistent | System Log
#===============================================================================
- id: "morning_test_email_system_check"
  alias: "Morning Test Email - System Check"
  description: "Sends a daily system check via Email, Telegram, Mobile Push and Persistent Notification at 08:00 to verify all channels are operational"

  trigger:
    - platform: time
      at: "08:00:00"

  condition: []

  action:
    # --- Email ---
    - service: notify.email_ha
      data:
        title: "✅ Home Assistant - System Status OK"
        message: >
          Good morning!

          This is your daily system check email.

          Home Assistant is up and running successfully.

          System Details:
          - Time: {{ now().strftime('%H:%M:%S') }}
          - Date: {{ now().strftime('%A, %d %B %Y') }}
          - System Uptime: {{ states('sensor.uptime') if states('sensor.uptime') != 'unknown' else 'N/A' }}

          All systems operational.

          ---
          Sent from Home Assistant
          IP: 192.168.1.31:8123
        html: >
          <!DOCTYPE html>
          <html>
          <head>
            <style>
              body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
              .container { max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f4f4; }
              .header { background-color: #41BDF5; color: white; padding: 20px; text-align: center; border-radius: 5px 5px 0 0; }
              .content { background-color: white; padding: 20px; border-radius: 0 0 5px 5px; }
              .status { background-color: #4CAF50; color: white; padding: 10px; border-radius: 5px; text-align: center; margin: 15px 0; }
              .details { background-color: #f9f9f9; padding: 15px; border-left: 4px solid #41BDF5; margin: 15px 0; }
              .footer { text-align: center; padding: 10px; color: #777; font-size: 12px; }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="header">
                <h1>✅ Home Assistant System Check</h1>
              </div>
              <div class="content">
                <p>Good morning!</p>
                <div class="status">
                  <strong>🟢 ALL SYSTEMS OPERATIONAL</strong>
                </div>
                <p>This is your daily system check email confirming that Home Assistant is up and running successfully.</p>
                <div class="details">
                  <h3>System Details:</h3>
                  <ul>
                    <li><strong>Time:</strong> {{ now().strftime('%H:%M:%S') }}</li>
                    <li><strong>Date:</strong> {{ now().strftime('%A, %d %B %Y') }}</li>
                    <li><strong>System IP:</strong> 192.168.1.31:8123</li>
                  </ul>
                </div>
                <p>All automation services are functioning normally.</p>
              </div>
              <div class="footer">
                Home Assistant • {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
              </div>
            </div>
          </body>
          </html>

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_id_2
        message: >-
          ✅ *Home Assistant — System Check OK (08:00)*

          Good morning! HA is up and running.

          📅 Date: {{ now().strftime('%A, %d %B %Y') }}
          ⏰ Time: {{ now().strftime('%H:%M:%S') }}
          ⏱️ Uptime: {{ states('sensor.uptime') if states('sensor.uptime') not in ['unknown','unavailable'] else 'N/A' }}
          🌐 IP: 192.168.1.31:8123

          🟢 All systems operational.
        parse_mode: markdown

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "✅ HA System Check OK"
        message: "Good morning! HA is running — {{ now().strftime('%A, %d %B %Y %H:%M') }} — All systems operational."
        data:
          channel: "System Status"
          importance: default
          group: "ha-system-check"
          color: "#4CAF50"
          icon_url: "https://www.home-assistant.io/images/favicon-192x192-full.png"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "✅ System Check OK (08:00)"
        message: >-
          Home Assistant daily system check completed at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

          ✅ Email sent — notify.email_ha
          ✅ Telegram sent — chat_id_2
          ✅ Mobile Push sent — SM-G996B
          ✅ System is operational

          Date: {{ now().strftime('%A, %d %B %Y') }}
          Uptime: {{ states('sensor.uptime') if states('sensor.uptime') not in ['unknown','unavailable'] else 'N/A' }}
        notification_id: "morning_system_check"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Morning system check sent at {{ now().strftime('%Y-%m-%d %H:%M:%S') }} via Email, Telegram, Mobile Push and Persistent Notification.
        level: info

  mode: single
#===============================================================================
# END OF MORNING TEST EMAIL - SYSTEM CHECK
#===============================================================================