#===============================================================================
# SECURITY: IP Ban Daily Summary (06:15)
# File: automations/security_ipban_daily_summary.yaml
# Updated: 2026-06-04
# Sends a daily summary only when new IP bans occurred since the previous
# baseline. Updates the baseline after the check.
# Channels: Email | Telegram | Mobile Push (SM-G996B) | Persistent | System Log
#===============================================================================

- id: security_ip_ban_daily_summary_0615
  alias: "Security - IP Ban Daily Summary (06:15)"
  description: >
    Compares the current Home Assistant IP ban count to the stored previous
    count. Sends a daily summary only when new IP bans occurred since the last
    baseline. Updates the baseline after the check.

  trigger:
    - platform: time
      at: "06:15:00"

  mode: single

  action:
    - variables:
        current: "{{ states('sensor.home_assistant_ip_bans_count') | int(0) }}"
        baseline: "{{ states('input_number.ipbans_previous_count') | int(0) }}"
        diff: "{{ [current - baseline, 0] | max }}"
        risk_level: >-
          {% if diff >= 10 %}CRITICAL
          {% elif diff >= 5 %}HIGH
          {% elif diff >= 1 %}ELEVATED
          {% else %}NORMAL
          {% endif %}
        risk_color: >-
          {% if diff >= 10 %}#B71C1C
          {% elif diff >= 5 %}#F44336
          {% elif diff >= 1 %}#FF9800
          {% else %}#4CAF50
          {% endif %}

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ diff > 0 }}"
          sequence:
            - service: persistent_notification.create
              data:
                title: "Security: IP Ban Daily Summary - {{ risk_level }} (06:15 {{ now().strftime('%d %b %Y') }})"
                message: >-
                  Daily IP ban summary generated at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

                  Summary:
                  • Previous count: {{ baseline }}
                  • Current count: {{ current }}
                  • New IP bans: {{ diff }}
                  • Risk level: {{ risk_level }}

                  Recommended checks:
                  • Review /config/ip_bans.yaml
                  • Review /config/home-assistant.log
                  • Confirm no trusted device or service was blocked by mistake

                  Local: http://192.168.1.31:8123
                  Cloud: https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/
                notification_id: "security_ip_ban_daily_summary"

            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_id_2
                message: >-
                  🚨 *Security: IP Ban Daily Summary - {{ risk_level }}*

                  Previous: {{ baseline }}
                  Current: {{ current }}
                  New IP bans: {{ diff }}
                  Risk: *{{ risk_level }}*

                  Review `/config/ip_bans.yaml` and `/config/home-assistant.log`
                  _{{ now().strftime('%Y-%m-%d %H:%M:%S') }}_
                  🌐 192.168.1.31:8123
                parse_mode: markdown

            - service: notify.email_ha
              data:
                title: "Security: IP Ban Daily Summary - {{ risk_level }} ({{ now().strftime('%Y-%m-%d') }})"
                message: >-
                  SECURITY IP BAN DAILY SUMMARY

                  Date: {{ now().strftime('%A, %d %B %Y at %H:%M:%S') }}

                  SUMMARY
                  Previous count: {{ baseline }}
                  Current count: {{ current }}
                  New IP bans detected: {{ diff }}
                  Risk level: {{ risk_level }}

                  RECOMMENDED ACTIONS
                  1. Review /config/ip_bans.yaml for blocked IP addresses
                  2. Review /config/home-assistant.log for failed authentication events
                  3. Confirm no valid device or service was blocked
                  4. Review network access controls if repeated attempts continue

                  System: http://192.168.1.31:8123
                  Cloud: https://gy98slwcfto2t5oia2xnqjeabx480gs6.ui.nabu.casa/

            - service: notify.mobile_app_sm_g996b
              data:
                title: "Security - IP Ban Daily Summary"
                message: >-
                  {{ diff }} new IP ban(s). Previous: {{ baseline }} | Current: {{ current }} | Risk: {{ risk_level }}.
                data:
                  channel: "Security"
                  importance: high
                  group: "ha-security"
                  color: "{{ risk_color }}"
                  actions:
                    - action: "OPEN_HA"
                      title: "Open HA"
                      uri: "http://192.168.1.31:8123"

            - service: system_log.write
              data:
                message: >-
                  Security IP Ban Daily Summary sent at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
                  Previous: {{ baseline }}, Current: {{ current }}, New bans: {{ diff }}, Risk: {{ risk_level }}.
                level: warning

    - service: input_number.set_value
      target:
        entity_id: input_number.ipbans_previous_count
      data:
        value: "{{ current }}"