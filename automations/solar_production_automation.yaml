#-----------------------------------------------------------------------------
# LOW PRODUCTION ALERT - 20:00
#-----------------------------------------------------------------------------
- id: solar_low_production_alert
  alias: "Solar: Low Production Alert"
  description: "Alert on low production days via all channels at 20:00"

  trigger:
    - platform: time
      at: "20:00:00"

  condition:
    - condition: template
      value_template: >-
        {% set total = states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) + states('sensor.deyeinvertermaster_summary_day_pv2') | float(0) %}
        {% set target = states('input_number.solar_generation_target') | float(25) %}
        {{ total < (target * 0.5) }}

  action:
    - variables:
        pv1: "{{ states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) | round(2) }}"
        pv2: "{{ states('sensor.deyeinvertermaster_summary_day_pv2') | float(0) | round(2) }}"
        total: "{{ (states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) + states('sensor.deyeinvertermaster_summary_day_pv2') | float(0)) | round(2) }}"
        target: "{{ states('input_number.solar_generation_target') | float(25) }}"
        achievement: "{{ ((states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) + states('sensor.deyeinvertermaster_summary_day_pv2') | float(0)) / states('input_number.solar_generation_target') | float(25) * 100) | round(1) }}"
        shortfall: "{{ (states('input_number.solar_generation_target') | float(25) - (states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) + states('sensor.deyeinvertermaster_summary_day_pv2') | float(0))) | round(2) }}"

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01K7PH2MD1SA9VXHCP39WVCJM4
        message: >-
          ⚠️ *LOW SOLAR PRODUCTION*


          Production below normal today.


          *TODAY*

          • PV1: {{ pv1 }} kWh

          • PV2: {{ pv2 }} kWh

          • Total: {{ total }} kWh


          *EXPECTED*

          • Target: {{ target }} kWh

          • Achieved: {{ achievement }}%

          • Shortfall: {{ shortfall }} kWh


          Check system tomorrow.
        parse_mode: markdown

    # --- Email ---
    - service: notify.email_ha
      data:
        title: >-
          ⚠️ Low Solar Production Alert - {{ now().strftime('%Y-%m-%d') }}
        message: >-
          LOW SOLAR PRODUCTION ALERT

          Date: {{ now().strftime('%A, %d %B %Y') }}

          ================================================================================

          WARNING: Solar production is significantly below normal levels today.


          TODAY'S PRODUCTION

          PV1 Production: {{ pv1 }} kWh

          PV2 Production: {{ pv2 }} kWh

          Total Production: {{ total }} kWh


          EXPECTED vs ACTUAL

          Daily Target: {{ target }} kWh

          Target Achievement: {{ achievement }}%

          Shortfall: {{ shortfall }} kWh


          POSSIBLE CAUSES

          - Heavy cloud coverage or rain
          - Panel shading or obstructions
          - Dust or debris on panels
          - System fault or inverter issue
          - Seasonal variation (winter months)


          RECOMMENDED ACTIONS

          1. Check weather conditions - was it overcast or rainy?
          2. Visually inspect solar panels for dirt or obstructions
          3. Verify inverter is operating normally
          4. Check for any error messages on inverter display
          5. Monitor tomorrow's production
          6. If issue persists for 3+ days, contact installer


          ================================================================================

          This alert triggers when production falls below 50% of daily target.

          System: http://192.168.1.31:8123

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "⚠️ Low Solar Production Alert"
        message: "Only {{ total }} kWh produced today ({{ achievement }}% of {{ target }} kWh target). Shortfall: {{ shortfall }} kWh. Check panels tomorrow."
        data:
          channel: "Solar Reports"
          importance: high
          group: "ha-solar"
          color: "#FF5722"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "⚠️ Low Solar Production Alert — {{ now().strftime('%d %b %Y') }}"
        message: >-
          Low solar production detected on {{ now().strftime('%A, %d %B %Y') }}.

          ⚡ Total Production: {{ total }} kWh
          🔆 PV1: {{ pv1 }} kWh | PV2: {{ pv2 }} kWh
          🎯 Target: {{ target }} kWh
          📊 Achievement: {{ achievement }}%
          📉 Shortfall: {{ shortfall }} kWh

          Possible causes: Cloud cover, dirty panels, shading or inverter issue.
          Monitor tomorrow and check panels if persistent.
        notification_id: "solar_low_production"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Low production alert: {{ total }} kWh ({{ achievement }}% of target {{ target }} kWh). Shortfall: {{ shortfall }} kWh.
        level: warning

  mode: single

#-----------------------------------------------------------------------------
# STRING IMBALANCE - 19:00
#-----------------------------------------------------------------------------
- id: solar_pv_string_imbalance
  alias: "Solar: String Imbalance"
  description: "Alert on PV string imbalance via all channels at 19:00"

  trigger:
    - platform: time
      at: "19:00:00"

  condition:
    - condition: template
      value_template: >-
        {% set pv1 = states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) %}
        {% set pv2 = states('sensor.deyeinvertermaster_summary_day_pv2') | float(0) %}
        {% set avg = (pv1 + pv2) / 2 %}
        {% set diff = (pv1 - pv2) | abs %}
        {{ (diff / avg * 100) > 20 and pv1 > 1 and pv2 > 1 }}

  action:
    - variables:
        pv1: "{{ states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) | round(2) }}"
        pv2: "{{ states('sensor.deyeinvertermaster_summary_day_pv2') | float(0) | round(2) }}"
        diff: "{{ (states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) - states('sensor.deyeinvertermaster_summary_day_pv2') | float(0)) | abs | round(2) }}"
        avg: "{{ ((states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) + states('sensor.deyeinvertermaster_summary_day_pv2') | float(0)) / 2) | round(2) }}"
        variance: "{{ ((states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) - states('sensor.deyeinvertermaster_summary_day_pv2') | float(0)) | abs / ((states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) + states('sensor.deyeinvertermaster_summary_day_pv2') | float(0)) / 2) * 100) | round(1) }}"

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01K7PH2MD1SA9VXHCP39WVCJM4
        message: >-
          ⚠️ *PV STRING IMBALANCE*


          String production difference detected.


          *STRINGS*

          🔆 PV1: {{ pv1 }} kWh

          🔆 PV2: {{ pv2 }} kWh


          *DIFFERENCE*

          {{ diff }} kWh ({{ variance }}% variance)


          *CHECK FOR*

          1. Shading on one string

          2. Panel soiling

          3. Connection issues


          Monitor for several days.
        parse_mode: markdown

    # --- Email ---
    - service: notify.email_ha
      data:
        title: >-
          ⚠️ PV String Imbalance Detected - {{ now().strftime('%Y-%m-%d') }}
        message: >-
          PV STRING IMBALANCE ALERT

          Date: {{ now().strftime('%A, %d %B %Y') }}

          ================================================================================

          WARNING: Significant production difference detected between PV strings.


          STRING PRODUCTION TODAY

          PV String 1: {{ pv1 }} kWh

          PV String 2: {{ pv2 }} kWh


          IMBALANCE ANALYSIS

          Production Difference: {{ diff }} kWh

          Variance Percentage: {{ variance }}%

          {% if pv1 | float > pv2 | float %}
          Higher Producer: PV String 1 ({{ ((pv1 | float - pv2 | float) / pv2 | float * 100) | round(1) }}% more than PV2)
          {% else %}
          Higher Producer: PV String 2 ({{ ((pv2 | float - pv1 | float) / pv1 | float * 100) | round(1) }}% more than PV1)
          {% endif %}


          POSSIBLE CAUSES

          1. SHADING ISSUES
             - Partial shading on one string during the day
             - Tree growth or new obstructions
             - Building shadows at certain times

          2. PANEL CONDITION
             - Dust, dirt, or debris on panels in one string
             - Bird droppings or leaves

          3. TECHNICAL ISSUES
             - Loose or corroded connections in one string
             - Faulty panel in one string
             - MPPT tracking issue
             - Wiring resistance problems

          4. INSTALLATION FACTORS
             - Different panel orientations
             - Uneven panel angles


          RECOMMENDED ACTIONS

          IMMEDIATE CHECKS:
          1. Visually inspect both PV strings for obvious issues
          2. Check for shading patterns throughout the day
          3. Look for dirt, dust, or debris on panels
          4. Verify all connections are secure

          IF ISSUE PERSISTS:
          5. Clean all panels thoroughly
          6. Inspect wiring and connections closely
          7. Check inverter display for error codes
          8. Contact solar installer for assessment


          WHEN TO CALL INSTALLER

          - Imbalance persists for more than 3 consecutive days
          - Variance increases over time
          - One string shows no production
          - Inverter displays error messages


          ================================================================================

          This alert triggers when string production differs by more than 20%.

          System: http://192.168.1.31:8123

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "⚠️ PV String Imbalance Detected"
        message: "PV1: {{ pv1 }} kWh vs PV2: {{ pv2 }} kWh — {{ variance }}% variance ({{ diff }} kWh difference). Check panels for shading or soiling."
        data:
          channel: "Solar Reports"
          importance: high
          group: "ha-solar"
          color: "#FF9800"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "⚠️ PV String Imbalance — {{ now().strftime('%d %b %Y') }}"
        message: >-
          PV string imbalance detected on {{ now().strftime('%A, %d %B %Y') }}.

          🔆 PV1: {{ pv1 }} kWh
          🔆 PV2: {{ pv2 }} kWh
          📉 Difference: {{ diff }} kWh
          📊 Variance: {{ variance }}%

          Possible causes: Shading, panel soiling, loose connections or faulty panel.
          Monitor for 3 consecutive days before calling installer.
        notification_id: "solar_string_imbalance"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          PV string imbalance detected: PV1={{ pv1 }} kWh, PV2={{ pv2 }} kWh, Diff={{ diff }} kWh, Variance={{ variance }}%.
        level: warning

  mode: single

#-----------------------------------------------------------------------------
# MONTHLY SUMMARY - 1st of each month at 10:00
#-----------------------------------------------------------------------------
- id: solar_monthly_summary
  alias: "Solar: Monthly Summary"
