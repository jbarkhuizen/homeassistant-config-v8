#-----------------------------------------------------------------------------
# DAILY SOLAR PRODUCTION REPORT - 22:00
#-----------------------------------------------------------------------------
- id: daily_solar_production_report
  alias: "Solar: Daily Production Report at 22:00"
  description: "Comprehensive daily solar production summary via all channels"

  trigger:
    - platform: time
      at: "22:00:00"

  condition: []

  action:
    - variables:
        pv1: "{{ states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) | round(2) }}"
        pv2: "{{ states('sensor.deyeinvertermaster_summary_day_pv2') | float(0) | round(2) }}"
        total: "{{ (states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) + states('sensor.deyeinvertermaster_summary_day_pv2') | float(0)) | round(2) }}"
        target: "{{ states('input_number.solar_generation_target') | float(25) }}"
        achievement: "{{ ((states('sensor.deyeinvertermaster_summary_day_pv1') | float(0) + states('sensor.deyeinvertermaster_summary_day_pv2') | float(0)) / states('input_number.solar_generation_target') | float(25) * 100) | round(1) }}"
        battery_charged: "{{ states('sensor.deyeinvertermaster_summary_day_battery_charge') | float(0) | round(2) }}"
        grid_export: "{{ states('sensor.deyeinvertermaster_summary_day_grid_export_sell') | float(0) | round(2) }}"

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01K7PH2MD1SA9VXHCP39WVCJM4
        parse_mode: markdown
        message: >-
          ☀️ *DAILY SOLAR PRODUCTION REPORT*


          📅 {{ now().strftime('%A, %d %B %Y') }}


          *PV STRING PRODUCTION*

          🔆 PV1: {{ pv1 }} kWh

          🔆 PV2: {{ pv2 }} kWh

          ⚡ Total: {{ total }} kWh


          *CUMULATIVE*

          📊 PV1 Total: {{ states('sensor.deyeinvertermaster_summary_total_pv1_fix') | float(0) | round(1) }} kWh

          📊 PV2 Total: {{ states('sensor.deyeinvertermaster_summary_total_pv2_fix') | float(0) | round(1) }} kWh


          *PERFORMANCE*

          🎯 Target: {{ target }} kWh

          📊 Achievement: {{ achievement }}%

          🔋 Battery Charged: {{ battery_charged }} kWh

          📤 Grid Export: {{ grid_export }} kWh


          🌐 http://192.168.1.31:8123

    # --- Email ---
    - service: notify.email_ha
      data:
        title: >-
          Daily Solar Production - {{ now().strftime('%Y-%m-%d') }}
        message: >-
          DAILY SOLAR PRODUCTION REPORT

          Date: {{ now().strftime('%A, %d %B %Y') }}


          PV1: {{ pv1 }} kWh

          PV2: {{ pv2 }} kWh

          Total: {{ total }} kWh


          Target: {{ target }} kWh

          Achievement: {{ achievement }}%


          Battery Charged: {{ battery_charged }} kWh

          Grid Export: {{ grid_export }} kWh


          System: http://192.168.1.31:8123

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "☀️ Solar Daily Report — {{ now().strftime('%d %b %Y') }}"
        message: "Total: {{ total }} kWh ({{ achievement }}% of target) | PV1: {{ pv1 }} kWh | PV2: {{ pv2 }} kWh | Battery: {{ battery_charged }} kWh"
        data:
          channel: "Solar Reports"
          importance: default
          group: "ha-solar"
          color: "#FF9800"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "☀️ Solar Daily Report — {{ now().strftime('%d %b %Y') }}"
        message: >-
          Daily solar production report at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

          ⚡ Total Production: {{ total }} kWh
          🔆 PV1: {{ pv1 }} kWh | PV2: {{ pv2 }} kWh
          🎯 Target: {{ target }} kWh ({{ achievement }}% achieved)
          🔋 Battery Charged: {{ battery_charged }} kWh
          📤 Grid Export: {{ grid_export }} kWh
        notification_id: "solar_daily_report"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Solar daily report sent. Total: {{ total }} kWh ({{ achievement }}% of target {{ target }} kWh). PV1: {{ pv1 }} kWh, PV2: {{ pv2 }} kWh.
        level: info

  mode: single

#-----------------------------------------------------------------------------
# WEEKLY SUMMARY - MONDAYS 09:00
#-----------------------------------------------------------------------------
- id: weekly_solar_production_summary
  alias: "Solar: Weekly Summary"
  description: "Weekly solar production statistics via all channels every Monday at 09:00"

  trigger:
    - platform: time
      at: "09:00:00"

  condition:
    - condition: time
      weekday:
        - mon

  action:
    - variables:
        pv1_total: "{{ states('sensor.deyeinvertermaster_summary_total_pv1_fix') | float(0) | round(1) }}"
        pv2_total: "{{ states('sensor.deyeinvertermaster_summary_total_pv2_fix') | float(0) | round(1) }}"
        combined: "{{ (states('sensor.deyeinvertermaster_summary_total_pv1_fix') | float(0) + states('sensor.deyeinvertermaster_summary_total_pv2_fix') | float(0)) | round(1) }}"
        daily_avg: "{{ ((states('sensor.deyeinvertermaster_summary_total_pv1_fix') | float(0) + states('sensor.deyeinvertermaster_summary_total_pv2_fix') | float(0)) / 7) | round(2) }}"
        target: "{{ states('input_number.solar_generation_target') | float(25) }}"
        weekly_target: "{{ states('input_number.solar_generation_target') | float(25) * 7 }}"
        weekly_achievement: "{{ ((states('sensor.deyeinvertermaster_summary_total_pv1_fix') | float(0) + states('sensor.deyeinvertermaster_summary_total_pv2_fix') | float(0)) / (states('input_number.solar_generation_target') | float(25) * 7) * 100) | round(1) }}"

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01K7PH2MD1SA9VXHCP39WVCJM4
        message: >-
          📊 *WEEKLY SOLAR SUMMARY*


          📅 {{ now().strftime('%d %B %Y') }}


          *PRODUCTION*

          ☀️ PV1: {{ pv1_total }} kWh

          ☀️ PV2: {{ pv2_total }} kWh

          ⚡ Total: {{ combined }} kWh


          *AVERAGE*

          📈 Daily: {{ daily_avg }} kWh/day

          🎯 Target: {{ target }} kWh/day

          📊 Weekly Achievement: {{ weekly_achievement }}%


          Have a great week!
        parse_mode: markdown

    # --- Email ---
    - service: notify.email_ha
      data:
        title: >-
          Weekly Solar Production Summary - {{ now().strftime('%d %B %Y') }}
        message: >-
          WEEKLY SOLAR PRODUCTION SUMMARY

          Week Ending: {{ now().strftime('%A, %d %B %Y') }}

          ================================================================================

          PRODUCTION TOTALS

          PV1 Production: {{ pv1_total }} kWh

          PV2 Production: {{ pv2_total }} kWh

          Combined Total: {{ combined }} kWh


          DAILY AVERAGES

          Average PV1: {{ (pv1_total | float / 7) | round(2) }} kWh/day

          Average PV2: {{ (pv2_total | float / 7) | round(2) }} kWh/day

          Average Total: {{ daily_avg }} kWh/day


          TARGET COMPARISON

          Daily Target: {{ target }} kWh/day

          Weekly Target: {{ weekly_target }} kWh

          Weekly Achievement: {{ weekly_achievement }}%


          ================================================================================

          Have a productive week ahead!

          System: http://192.168.1.31:8123

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "📊 Weekly Solar Summary — {{ now().strftime('%d %b %Y') }}"
        message: "Week Total: {{ combined }} kWh ({{ weekly_achievement }}% of target) | Daily Avg: {{ daily_avg }} kWh/day | Target: {{ target }} kWh/day"
        data:
          channel: "Solar Reports"
          importance: default
          group: "ha-solar"
          color: "#FF9800"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "📊 Weekly Solar Summary — {{ now().strftime('%d %b %Y') }}"
        message: >-
          Weekly solar summary sent at {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.

          ⚡ Combined Total: {{ combined }} kWh
          ☀️ PV1: {{ pv1_total }} kWh | PV2: {{ pv2_total }} kWh
          📈 Daily Average: {{ daily_avg }} kWh/day
          🎯 Target: {{ target }} kWh/day
          📊 Weekly Achievement: {{ weekly_achievement }}%
        notification_id: "solar_weekly_summary"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Weekly solar summary sent. Combined: {{ combined }} kWh, Daily avg: {{ daily_avg }} kWh/day, Achievement: {{ weekly_achievement }}%.
        level: info

  mode: single

