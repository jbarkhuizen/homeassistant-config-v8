  trigger:
    - platform: time
      at: "10:00:00"

  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"

  action:
    - variables:
        pv1_total: "{{ states('sensor.deyeinvertermaster_summary_total_pv1_fix') | float(0) | round(1) }}"
        pv2_total: "{{ states('sensor.deyeinvertermaster_summary_total_pv2_fix') | float(0) | round(1) }}"
        combined: "{{ (states('sensor.deyeinvertermaster_summary_total_pv1_fix') | float(0) + states('sensor.deyeinvertermaster_summary_total_pv2_fix') | float(0)) | round(1) }}"
        daily_avg: "{{ ((states('sensor.deyeinvertermaster_summary_total_pv1_fix') | float(0) + states('sensor.deyeinvertermaster_summary_total_pv2_fix') | float(0)) / 30) | round(2) }}"
        target: "{{ states('input_number.solar_generation_target') | float(25) }}"
        value_zar: "{{ ((states('sensor.deyeinvertermaster_summary_total_pv1_fix') | float(0) + states('sensor.deyeinvertermaster_summary_total_pv2_fix') | float(0)) * 2.50) | round(2) }}"
        monthly_achievement: "{{ (daily_avg | float / states('input_number.solar_generation_target') | float(25) * 100) | round(1) }}"

    # --- Telegram ---
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01K7PH2MD1SA9VXHCP39WVCJM4
        parse_mode: markdown
        message: >-
          📊 *MONTHLY SOLAR REPORT*


          📅 {{ now().strftime('%B %Y') }}


          *TOTAL*

          ☀️ Generated: {{ combined }} kWh

          • PV1: {{ pv1_total }} kWh

          • PV2: {{ pv2_total }} kWh


          *AVERAGE*

          📈 Daily: {{ daily_avg }} kWh/day

          🎯 Target: {{ target }} kWh/day

          📊 Achievement: {{ monthly_achievement }}%


          *VALUE*

          💰 ZAR {{ value_zar }}


          Great month!

    # --- Email ---
    - service: notify.email_ha
      data:
        title: >-
          Monthly Solar Report - {{ now().strftime('%B %Y') }}
        message: >-
          MONTHLY SOLAR PRODUCTION REPORT

          Month: {{ now().strftime('%B %Y') }}


          Total Generated: {{ combined }} kWh

          PV1: {{ pv1_total }} kWh

          PV2: {{ pv2_total }} kWh


          Daily Average: {{ daily_avg }} kWh/day

          Target: {{ target }} kWh/day

          Achievement: {{ monthly_achievement }}%


          Financial Value: ZAR {{ value_zar }}


          System: http://192.168.1.31:8123

    # --- Mobile Push ---
    - service: notify.mobile_app_sm_g996b
      data:
        title: "📊 Monthly Solar Report — {{ now().strftime('%B %Y') }}"
        message: "{{ combined }} kWh generated ({{ monthly_achievement }}% of target avg) | Daily avg: {{ daily_avg }} kWh | Value: ZAR {{ value_zar }}"
        data:
          channel: "Solar Reports"
          importance: default
          group: "ha-solar"
          color: "#FF9800"
          actions:
            - action: "OPEN_HA"
              title: "Open HA"
              uri: "http://192.168.1.31:8123"

    # --- Persistent Notification ---
    - service: persistent_notification.create
      data:
        title: "📊 Monthly Solar Report — {{ now().strftime('%B %Y') }}"
        message: >-
          Monthly solar report for {{ now().strftime('%B %Y') }}.

          ⚡ Total Generated: {{ combined }} kWh
          ☀️ PV1: {{ pv1_total }} kWh | PV2: {{ pv2_total }} kWh
          📈 Daily Average: {{ daily_avg }} kWh/day
          🎯 Target: {{ target }} kWh/day
          📊 Achievement vs Target: {{ monthly_achievement }}%
          💰 Estimated Value: ZAR {{ value_zar }}
        notification_id: "solar_monthly_report"

    # --- System Log ---
    - service: system_log.write
      data:
        message: >-
          Monthly solar report sent for {{ now().strftime('%B %Y') }}. Combined: {{ combined }} kWh, Daily avg: {{ daily_avg }} kWh/day, Achievement: {{ monthly_achievement }}%, ZAR {{ value_zar }}.
        level: info

  mode: single
#===============================================================================
# END OF SOLAR PRODUCTION REPORTS
#===============================================================================
