title: Battery
views:
  - title: Overview
    path: overview
    icon: mdi:battery-heart-variant
    badges: []
    cards:
      - type: markdown
        title: Battery Health Summary
        content: |
          - System Battery Health Score: {{ states('sensor.battery_system_health_score') }}%
          - Devices, Total: {{ states('sensor.battery_devices_total_count') }}, Low: {{ states('sensor.battery_devices_low_count') }}, Critical: {{ states('sensor.battery_devices_critical_count') }}
          - Alerts Active: {{ states('binary_sensor.battery_alert_active') }}
          - Next Replacement Suggested: {{ states('sensor.battery_next_replacement_needed') }}
          - Alerts Enabled: {{ states('input_boolean.battery_alerts_enabled') }} | Weekly Report: {{ states('input_boolean.battery_weekly_report_enabled') }}

      - type: entities
        title: Controls & Thresholds
        entities:
          - entity: input_boolean.battery_alerts_enabled
            name: Enable Battery Alerts
          - entity: input_boolean.battery_weekly_report_enabled
            name: Enable Weekly Battery Report
          - entity: input_number.battery_warning_threshold
            name: Battery Warning Level
          - entity: input_number.battery_low_threshold
            name: Battery Low Level
          - entity: input_number.battery_critical_threshold
            name: Battery Critical Level

      - type: glance
        title: Key Status
        entities:
          - entity: sensor.battery_devices_total_count
            name: Total
          - entity: sensor.battery_devices_low_count
            name: Low
          - entity: sensor.battery_devices_critical_count
            name: Critical
          - entity: binary_sensor.battery_alert_active
            name: Alerts Active

      - type: entities
        title: Highlighted Devices
        entities:
          - entity: sensor.sonoff_1000fd4860_battery_voltage
            name: Salon Front Door Sensor Battery Voltage
          - entity: sensor.sonoff_100150eae4_battery_voltage
            name: Garage Mid Door Sensor Battery Voltage
          - entity: sensor.sonoff_1002357bda_battery
            name: Braai Door Sensor New Battery
          - entity: sensor.sonoff_a480098890_battery
            name: Front Door Sensor Battery
          - entity: sensor.sonoff_a4800d7025_battery
            name: Back Door Sensor Battery
          - entity: sensor.sonoff_a48008e4cc_battery
            name: Temperature/Humidity Sensor Battery
          - entity: sensor.sonoff_a4800986dd_battery
            name: Bedroom Temperature/Humidity Sensor Battery

  - title: Devices
    path: devices
    icon: mdi:battery
    badges: []
    cards:
      - type: markdown
        title: Smart Home Battery Devices
        content: |
          This view uses the current live entity IDs from your Home Assistant setup.
          Unavailable means the entity exists but the device is not reporting right now.

      - type: entities
        title: Door / Window / Motion Sensors
        entities:
          - entity: sensor.sonoff_1000fd4860_battery_voltage
            name: Salon Front Door Sensor Battery Voltage
          - entity: sensor.sonoff_100150eae4_battery_voltage
            name: Garage Mid Door Sensor Battery Voltage
          - entity: sensor.sonoff_1002357bda_battery
            name: Braai Door Sensor New Battery
          - entity: sensor.sonoff_1002357619_battery
            name: Top Floor Window 1 Battery
          - entity: sensor.sonoff_a48005596e_battery
            name: Gang Motion Sensor Battery
          - entity: sensor.sonoff_a480098890_battery
            name: Front Door Sensor Battery
          - entity: sensor.sonoff_a4800d7025_battery
            name: Back Door Sensor Battery
          - entity: sensor.sonoff_a4800e446e_battery
            name: SNZB-05P Battery

      - type: entities
        title: Temperature / Humidity Sensors
        entities:
          - entity: sensor.sonoff_a48008e4cc_battery
            name: Temperature/Humidity Sensor Battery
          - entity: sensor.sonoff_a48008e4cc_temperature
            name: Temperature/Humidity Sensor Temperature
          - entity: sensor.sonoff_a48008e4cc_humidity
            name: Temperature/Humidity Sensor Humidity
          - entity: sensor.sonoff_a4800986dd_battery
            name: Bedroom Temperature/Humidity Sensor Battery
          - entity: sensor.sonoff_a4800986dd_temperature
            name: Bedroom Temperature/Humidity Sensor Temperature
          - entity: sensor.sonoff_a4800986dd_humidity
            name: Bedroom Temperature/Humidity Sensor Humidity

      - type: entities
        title: Device Connectivity
        entities:
          - entity: sensor.sonoff_1000fd4860_connection
            name: Salon Front Door Sensor Connection
          - entity: sensor.sonoff_100150eae4_connection
            name: Garage Mid Door Sensor Connection
          - entity: sensor.sonoff_1002357bda_connection
            name: Braai Door Sensor New Connection
          - entity: sensor.sonoff_1002357619_connection
            name: Top Floor Window 1 Connection
          - entity: sensor.sonoff_a48005596e_connection
            name: Gang Motion Sensor Connection
          - entity: sensor.sonoff_a48008e4cc_connection
            name: Temperature/Humidity Sensor Connection
          - entity: sensor.sonoff_a4800986dd_connection
            name: Bedroom Temperature/Humidity Sensor Connection
          - entity: sensor.sonoff_a480098890_connection
            name: Front Door Sensor Connection
          - entity: sensor.sonoff_a4800d7025_connection
            name: Back Door Sensor Connection
          - entity: sensor.sonoff_a4800e446e_connection
            name: SNZB-05P Connection

  - title: Replacement
    path: replacement
    icon: mdi:battery-sync
    badges: []
    cards:
      - type: markdown
        title: Replacement Tracking Status
        content: |
          Battery Notes replacement buttons, battery type sensors and last replaced sensors are not currently present in Home Assistant.
          This section stays simplified until those entities are available again.

      - type: entities
        title: Available Battery Management Entities
        entities:
          - entity: sensor.battery_next_replacement_needed
            name: Next Replacement Needed
          - entity: binary_sensor.battery_alert_active
            name: Battery Alert Active
          - entity: input_boolean.battery_alerts_enabled
            name: Enable Battery Alerts
          - entity: input_boolean.battery_weekly_report_enabled
            name: Enable Weekly Battery Report

  - title: Trends
    path: trends
    icon: mdi:chart-line
    badges: []
    cards:
      - type: statistics-graph
        title: Battery Trends (14 days)
        chart_type: line
        period: day
        days_to_show: 14
        stat_types:
          - mean
        entities:
          - sensor.sonoff_1002357bda_battery
          - sensor.sonoff_1000fd4860_battery_voltage
          - sensor.sonoff_100150eae4_battery_voltage

      - type: history-graph
        title: Battery Alerts & Thresholds (48h)
        hours_to_show: 48
        entities:
          - binary_sensor.battery_alert_active
          - input_number.battery_warning_threshold
          - input_number.battery_low_threshold
          - input_number.battery_critical_threshold