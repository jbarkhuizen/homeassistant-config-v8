title: Automation & Updates
views:
  - title: Update Status
    path: updates
    icon: mdi:package-up
    cards:
      - type: markdown
        title: Update Summary
        content: |
          - Total Updates: {{ state_attr('sensor.home_assistant_updates_summary', 'total_updates') }}
          - Friendly Summary: {{ state_attr('sensor.home_assistant_updates_summary', 'friendly_summary') }}
          - Auto Update Status: {{ states('sensor.auto_update_status') }}
          - Status Detail: {{ state_attr('sensor.auto_update_status', 'status_detail') }}
          - Restart Required: {{ state_attr('sensor.auto_update_status', 'restart_required') }}

      - type: entities
        title: Core Updates
        entities:
          - entity: update.home_assistant_core_update
            name: Home Assistant Core
          - entity: update.home_assistant_supervisor_update
            name: Home Assistant Supervisor
          - entity: update.home_assistant_operating_system_update
            name: Home Assistant Operating System

      - type: entities
        title: Update Cycle Status
        entities:
          - entity: sensor.auto_update_status
            name: Auto Update Status
          - entity: sensor.backup_health_status
            name: Backup Health Status
          - entity: sensor.backup_backup_manager_state
            name: Backup Manager State
          - entity: sensor.backup_last_successful_automatic_backup
            name: Last Successful Automatic Backup
          - entity: sensor.backup_last_attempted_automatic_backup
            name: Last Attempted Automatic Backup
          - entity: sensor.backup_next_scheduled_automatic_backup
            name: Next Scheduled Automatic Backup

  - title: Automation Monitoring
    path: automation-monitoring
    icon: mdi:robot-outline
    cards:
      - type: markdown
        title: Automation Overview
        content: |
          This dashboard focuses on stable automation and maintenance entities.
          - Maintenance Mode: {{ states('input_boolean.maintenance_mode') }}
          - Battery Devices Low Count: {{ states('sensor.battery_devices_low_count') }}
          - Battery Devices Critical Count: {{ states('sensor.battery_devices_critical_count') }}
          - Battery Health Score: {{ states('sensor.battery_system_health_score') }}
          - Bad Logins: {{ states('sensor.badlogin') }}
          - IP Bans Count: {{ states('sensor.home_assistant_ip_bans_count') }}

      - type: entities
        title: Maintenance & Security
        entities:
          - entity: input_boolean.maintenance_mode
            name: Maintenance Mode
          - entity: sensor.auto_update_status
            name: Auto Update Status
          - entity: sensor.backup_health_status
            name: Backup Health Status
          - entity: sensor.badlogin
            name: Bad Logins
          - entity: sensor.home_assistant_ip_bans_count
            name: Home Assistant IP Bans Count

      - type: entities
        title: Battery Monitoring
        entities:
          - entity: sensor.battery_devices_total_count
            name: Battery Devices Total Count
          - entity: sensor.battery_devices_low_count
            name: Battery Devices Low Count
          - entity: sensor.battery_devices_critical_count
            name: Battery Devices Critical Count
          - entity: sensor.battery_system_health_score
            name: Battery System Health Score
          - entity: sensor.battery_next_replacement_needed
            name: Battery Next Replacement Needed
          - entity: binary_sensor.battery_alert_active
            name: Battery Alert Active

      - type: statistics-graph
        title: Battery Health (Counts - 7 Days)
        chart_type: line
        period: day
        days_to_show: 7
        stat_types:
          - mean
        entities:
          - sensor.battery_devices_low_count
          - sensor.battery_devices_critical_count
          - sensor.battery_devices_total_count

      - type: markdown
        title: Backup & Update Cycle
        content: |
          - Backup Health Status: {{ states('sensor.backup_health_status') }}
          - Last Backup Success: {{ state_attr('sensor.backup_health_status', 'last_success') }}
          - Next Scheduled Backup: {{ state_attr('sensor.backup_health_status', 'next_backup') }}
          - Auto Update Last Run: {{ state_attr('sensor.auto_update_status', 'last_run') }}

  - title: Scheduled Windows
    path: schedule
    icon: mdi:calendar-clock
    cards:
      - type: markdown
        title: Daily Schedule (06h00-09h00 Window)
        content: |
          - 06:10 Badlogin Baseline
          - 06:14 IP Ban Spike
          - 06:15 IP Ban Summary
          - 06:30 Monthly DB (First Monday)
          - 06:35 Stale Data Recovery
          - 08:00 Influx Flow Verification
          - 08:05 System Overview Email
          - 08:15 Add-ons Health & Update Telegram
          - 08:18 Backup Health Check
          - 08:25 Solar Daily Report
          - 08:35 Stale Data Recovery (Second run)
          - 08:40 Weekly Solar Summary (Monday)
          - 08:45 DB & Log Trend Alert
          - 08:50 Maintenance Mode Reminder
          - 08:55 Git Snapshot
          - 09:00 DB Growth Check / Maintenance / Weekly Restart (Mon)

      - type: entities
        title: Maintenance Flags
        entities:
          - entity: input_boolean.maintenance_mode
            name: Maintenance Mode
          - entity: sensor.auto_update_status
            name: Auto Update Status
          - entity: sensor.backup_health_status
            name: Backup Health Status
          - entity: sensor.home_assistant_ip_bans_count
            name: Home Assistant IP Bans Count
          - entity: sensor.badlogin
            name: Bad Logins