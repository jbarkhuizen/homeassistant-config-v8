title: Pool & Garden

views:
  - title: Pool
    path: pool
    icon: mdi:pool
    cards:
      - type: markdown
        title: Pool Pump Summary
        content: |
          - Pump Switch Entity: {{ states('switch.sonoff_10009ce3f9') }}
          - Sonoff Pump Entity: {{ states('switch.sonoff_10009ce3f9') }}
          - Pump Power: {{ states('sensor.sonoff_10009ce3f9_power') }} W
          - PV Now: {{ states('sensor.deyeinvertercombined_pv_power') }} W
          - Battery SOC Combined: {{ states('sensor.deyeinvertercombined_battery_soc') }}%
          - Battery SOC Master: {{ states('sensor.deyeinvertermaster_battery_soc') }}%
          - Maintenance Mode: {{ states('input_boolean.maintenance_mode') }}
          - Last Pool Pump OFF Time: {{ states('input_datetime.pool_pump_last_off_time') }}
          - Automation thresholds: OFF < 2500 W for 15 min, ON > 3000 W for 15 min
          - Active automation window: 09:00–15:00
          - Restart cooldown after OFF: 10 minutes
          - Diagnostics Status: {{ states('sensor.pool_pump_diagnostics_current_status') }}
          - Forecast Today: {{ states('sensor.solar_forecast_total_today') }} kWh
          - Forecast Remaining: {{ states('sensor.solar_forecast_remaining_today') }} kWh
          - Forecast Quality: {{ states('sensor.solar_forecast_quality_today') }}
          - Recommended Slots: {{ states('sensor.solar_recommended_load_slots_today') }}

      - type: entities
        title: Pool Pump Control and Diagnostics
        entities:
#          - switch.pool_pump
          - switch.sonoff_10009ce3f9
          - sensor.sonoff_10009ce3f9_power
          - sensor.sonoff_10009ce3f9_energy
          - sensor.sonoff_10009ce3f9_voltage
          - sensor.deyeinvertercombined_pv_power
          - sensor.deyeinvertercombined_battery_soc
          - sensor.deyeinvertermaster_battery_soc
          - input_boolean.maintenance_mode
          - input_datetime.pool_pump_last_off_time
          - sensor.pool_pump_diagnostics_current_status

      - type: entities
        title: Pool Pump ON Condition Checks
        entities:
          - binary_sensor.pool_pump_diagnostics_maintenance_mode_clear
          - binary_sensor.pool_pump_diagnostics_time_window_active
          - binary_sensor.pool_pump_diagnostics_sonoff_ready_for_start
          - binary_sensor.pool_pump_diagnostics_pv_above_on_threshold
          - binary_sensor.pool_pump_diagnostics_cooldown_clear
          - binary_sensor.pool_pump_diagnostics_ready_to_start

      - type: history-graph
        title: Pump Entities vs PV
        hours_to_show: 24
        entities:
#          - switch.pool_pump
          - switch.sonoff_10009ce3f9
          - sensor.deyeinvertercombined_pv_power

      - type: entities
        title: Pool Pump Automations
        entities:
          - automation.solar_pool_pump_off_when_pv_2500_w_06_00_18_00
          - automation.solar_pool_pump_on_when_pv_3599_w_06_00_18_00
          - automation.solar_pool_pump_force_off_at_15_00

      - type: markdown
        title: What Must Be True for Pump ON
        content: |
          - Maintenance Mode must be off
          - Time must be between 09:00 and 15:00
          - Sonoff pump switch must be off
          - PV must be above 3000 W
          - PV must stay above 3000 W for 15 minutes, or be caught by the 5 minute recheck
          - Last OFF time must be more than 10 minutes ago

      - type: markdown
        title: What Must Be True for Pump OFF
        content: |
          - Maintenance Mode must be off
          - Time must be between 09:00 and 15:00
          - Sonoff pump switch must be on
          - PV must be below 2500 W
          - PV must stay below 2500 W for 15 minutes, or be caught by the 5 minute recheck
          - Automation thresholds: OFF < 2500 W for 15 min, ON > 3000 W for 15 min
          - Active solar control window: 09:00–15:00
          - Hard stop: pool pump forced OFF daily at 15:00
          - Restart cooldown after OFF: 10 minutes

  - title: Garden
    path: garden
    icon: mdi:flower
    cards:
      - type: markdown
        title: Garden Notes
        content: |
          Add irrigation controllers or moisture sensors here when you want to visualize them.